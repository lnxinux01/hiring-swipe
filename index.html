  return ref.length ? ref.filter(c=>passes(c,F)).length/ref.length : 1;

function updateCount(){

    const n=S.deck.filter(c=>passes(c,S.Fdraft)).length, tot=S.deck.length, thin=n<24;

        `<br><span style="color:var(--pass)">百里挑 ${per100>=1?per100:'一不到'}，确认每条都是必须。</span>`:''}`;

/* 从自由文本简历里抽出跟卡片同一套的维度。
   demo 用规则；生产上这一步该换成 LLM 抽取（ConFit 那类工作的做法），
   但下游打分逻辑一个字都不用改 —— 它只吃维度向量。 */
/* 公司名 → 类型。从生成器用的同一份常量推导，比手写正则准 */
const COMAP=(()=>{const m={}; for(const k of ['big','uni','start']) for(const n of CO[k]) m[n]=k; return m;})();
const STARTUP=/天使轮|种子轮|Pre-?A|A\+? ?轮|创业|初创|从 ?0 ?搭团队/;

function coOf(txt, jobTk){
  const rivals=TRACKS[jobTk].rival;
  const scan=ln=>{
    for(const n of rivals) if(ln.includes(n)) return 'rival';   // 对家优先：信息量最高
    for(const n in COMAP) if(ln.includes(n)) return COMAP[n];
    if(STARTUP.test(ln)) return 'start';
    return null;
  };
  for(const ln of txt.split(/\n/)) if(/实习|Intern/i.test(ln)){ const r=scan(ln); if(r) return r; }
  return scan(txt) || 'uni';
}
/* 赛道：简历上没人写「我在做 AI 应用」，只能从做过的模块和看的指标反推 */
function trackOf(txt){
  let best=null, bs=0;
  for(const k in TRACKS){
    const T=TRACKS[k]; let sc=0;
    for(const w of T.mod) if(txt.includes(w)) sc+=3;   // 做过的模块
    for(const w of T.met) if(txt.includes(w)) sc+=2;   // 看的指标

    if(sc>bs){bs=sc;best=k}
  }
  return bs>0?best:null;
}
const EX={
  major:[['cs', /计算机|软件工程|人工智能|智能科学|数据科学|Computer Science|Software Engineering|\bCS\b/i],
         ['eng',/自动化|电子信息|工业工程|生物医学|统计学|数学与应用|机械|物理/],
         ['biz',/工商管理|市场营销|新闻|传播|社会学|心理学|经济|金融|设计|汉语|文学/]],
  school:[['t1', /清华|北京大学|北大|上海交通|复旦|浙江大学|中国科学技术|南京大学/],
          ['sea',/香港|新加坡|南洋理工|伦敦大学|卡内基|伊利诺伊|Nanyang|Carnegie|UIUC|CMU|NUS|NTU|海外|[A-Z][a-z]+ University|University of/],
          ['t2', /中国人民大学|人大|武汉大学|华中科技|同济|北京航空|西安交通|哈尔滨工业|中山大学|厦门大学|东南大学|北京邮电|华东师范|985|211/],
          ['t3', /大学|学院|College/i]],
  // 「独立完成」在项目栏满天飞，不是 0→1 的证据；只认强信号
  z01:[['yes',/从 ?0 ?[到\-–—~至] ?1|0 ?[→>] ?1|从零|冷启动|第一版|自己写 ?PRD|牵头|没有专职|白手|独立负责/i],
       ['no', /日常迭代|维护|承接|配合运营|已有功能|成熟的|跟进 ?\d+ ?个版本/]],
  // 「文档整理」不算产出
  proof:[['quant',/\d+ ?%|提升到 ?\d{2,}|从 ?\d{2,}[^\n]{0,14}到 ?\d{2,}|增长了|翻[了倍]|GMV|ROI/],
         ['work', /沉淀|竞品拆解|竞品分析|可交互原型|完整原型|访谈纪要|作品集|演示视频|Figma/i],
         ['desc', /参与|协助|配合|跟进排期/]]
};
function extract(txt, jobTk){
  // z01/proof 只看经历 bullet 行 —— 「专业排名前 18%」这类教育数据不参与，
  // 否则整库都会被判成「有量化结果」，维度直接失效
  const bulls=txt.split(/\n/).filter(l=>/^[·\-•*]/.test(l.trim())).join('\n')||txt;
  const g=(dim,dflt)=>{
    const dom=(dim==='z01'||dim==='proof')?bulls:txt;
    for(const [lv,re] of (EX[dim]||[])) if(re.test(dom)) return lv;
    return dflt;
  };
  const tk=trackOf(txt);
  const code=['Python','SQL','Java','Go','JS/TS','C++'].filter(c=>
    new RegExp(c==='C++'?'C\\+\\+':c==='JS/TS'?'\\b(JS|TS)\\b|JavaScript|TypeScript|React|Vue':c,'i').test(txt));
  const yrExp=txt.match(/(\d+)\s*年.{0,6}(经验|工作)/);
  const mm=[...txt.matchAll(/(\d+)\s*个?月/g)].map(m=>+m[1]);
  const ages=txt.match(/(\d{2})\s*岁/);
  const ons=txt.match(/每周.{0,4}(\d)\s*天/);
  return {
    d:{ co:coOf(txt,jobTk), major:g('major','biz'), school:g('school','t3'),
        z01:g('z01','no'), proof:g('proof','desc'),
        track: tk===jobTk?'same' : tk===NEAR[jobTk]?'near' : 'cross' },
    code,
    en: /英语.{0,4}(可工作|工作|流利|母语)|雅思 ?[7-9]|托福 ?(9\d|10\d)/i.test(txt) ? '工作'
      : /英语|CET|四级|六级|日常沟通/i.test(txt) ? '日常' : '弱',
    jp: /N1|N2|日语/.test(txt) ? (/N1/.test(txt)?'N1':'N2') : null,
    fr: /法语|DELF|DALF|TCF/i.test(txt) ? '熟练' : null,
    months: (SOC()&&yrExp) ? +yrExp[1] : (mm.length? mm.reduce((a,b)=>a+b,0) : 6),
    onsite: ons? +ons[1] : 5,
    age: ages? +ages[1] : 23,
    name: ((txt.trim().split(/\n/)[0]||'未署名').split(/[\s\u3000|｜,，]+/)[0]).replace(/[：:].*/,'').slice(0,16) || '未署名'
  };
}
function scoreCV(c){
  if(!FIT) return {p:0.5, terms:[]};
  let z=FIT.b0; const terms=[];
  for(const dim in DIMS){
    const k=FIDX[dim+'|'+c.d[dim]];
    const b=k===undefined?0:FIT.b[k];
    terms.push({dim, label:DIMS[dim].L[c.d[dim]], b, dl:DIMS[dim].label});
    z+=b;
  }
  // 参照档系数恒为 0，直接比会失真 —— 减去该维度的均值才是真实贡献
  for(const t of terms){
    const all=Object.keys(DIMS[t.dim].L).map(lv=>{const k=FIDX[t.dim+'|'+lv]; return k===undefined?0:FIT.b[k];});
    t.rel = t.b - all.reduce((a,b)=>a+b,0)/all.length;
  }
  return {p:Math.min(.99, 1/(1+Math.exp(-z)) + softBonus(c)), terms:terms.sort((a,b)=>Math.abs(b.rel)-Math.abs(a.rel))};
}
function hardFail(c,F){
  const bad=[], D=FDEF;
  if(c.age<F.age[0]||c.age>F.age[1]) bad.push(`年龄 ${c.age}`);
  if(c.months<F.months[0]||c.months>F.months[1]) bad.push(`实习 ${c.months} 个月`);
  if(F.school.length&&!F.school.includes(c.d.school)) bad.push('院校');
  if(F.onsite.length&&!F.onsite.includes(c.onsite)) bad.push(`每周到岗 ${c.onsite} 天`);
  const mx=memExcluded(c);
  if(mx) bad.push(`记过不要：${DIMS[mx.dim].L[mx.lv]}`);
  for(const k of (F.kws||[])){
    const hit=cardText(c).includes(k.t.toLowerCase());
    if(k.neg&&hit) bad.push(`含「${k.t}」`);
    if(!k.neg&&!hit) bad.push(`缺「${k.t}」`);
  }
  if(F.gpaMin>0){ const g=parseFloat(c.gpa); if(g>0&&g<F.gpaMin) bad.push(`GPA ${c.gpa}`); }
  const pool_=c.code.concat(c.skill||[]);
  const miss=F.code.filter(x=>!pool_.some(y=>String(y).includes(x)));
  if(miss.length) bad.push('不会 '+miss.join('/'));
  if(F.lang.length&&!F.lang.some(x=> x==='en_work'?c.en==='工作' : x==='en_daily'?(c.en!=='弱') : x==='fr'?!!c.fr : !!c.jp)) bad.push('语言');
  return bad;
}
function runCV(){
  const raw=$('#cvtext').value.split(/\n\s*---+\s*\n|\n\s*\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>20);
  if(!raw.length){ $('#cvout').innerHTML='<div class="rcard"><div class="ev">粘简历，或点「载入示例」。</div></div>'; return; }

  const rows=raw.map(t=>{ const c=extract(t,S.tk); const sc=scoreCV(c); return {...c, ...sc, bad:hardFail(c,S.F), raw:t}; });
  const live=rows.filter(r=>!r.bad.length).sort((a,b)=>b.p-a.p);
  const dead=rows.filter(r=>r.bad.length).sort((a,b)=>b.p-a.p);
  // 被硬性条件锁死的维度，过关的人人都满足，拿它当加分项是废话
  const pinned=new Set([...(S.F.school.length?['school']:[]), ...(S.F.code.length||S.F.lang.length?['major']:[])]);
  const N=Math.max(1,Math.min(live.length,Math.round(live.length*0.3)));
  // 最该看见的一句话：你的硬性条件正在卡掉分数最高的人
  const buried=dead.length&&live.length&&dead[0].p>live[0].p ? dead[0] : null;
  const item=(r,i,off)=>`<div class="cvrow ${r.bad.length?'dead':''}">

        ${r.bad.length?`<span class="sig n">不满足硬性条件：${r.bad.join('、')}</span>`
          :r.terms.filter(t=>!pinned.has(t.dim)).slice(0,3).map(t=>`<span class="sig ${t.rel>.25?'p':t.rel<-.25?'n':'x'}">${t.rel>.25?'＋':t.rel<-.25?'−':'·'} ${t.label}</span>`).join('')}
      </div>
    </div>
    <div class="score"><b>${Math.round(r.p*100)}</b>
      <div class="sb"><i style="width:${Math.round(r.p*100)}%;background:${r.p>=.65?'var(--pick)':r.p>=.4?'var(--ink)':'var(--pass)'}"></i></div>
    </div></div>`;
  $('#cvout').innerHTML=`
    ${buried?`<div class="rcard warn" style="margin-top:20px">
      <div class="rh" style="color:var(--pass)">⚠︎ 硬性条件正在卡掉最好的人</div>
      <div class="ev" style="font-size:13.5px;color:var(--ink2)">
        <b>${buried.name}</b> 按你滑出来的标准拿 <b>${Math.round(buried.p*100)} 分</b>，比你要面的第一名（${live[0].name}，${Math.round(live[0].p*100)} 分）还高，
        但被「${buried.bad.join('、')}」卡掉了。<br><br><button class="tbtn" id="cvrelax">去放宽条件</button>
      </div></div>`:''}
    ${dead.length>rows.length*0.6?`<div class="rcard warn" style="margin-top:${buried?'12':'20'}px">
      <div class="rh" style="color:var(--pass)">⚠︎ ${dead.length}/${rows.length} 被卡在门外</div>
      <div class="ev" style="font-size:13.5px;color:var(--ink2)">筛掉六成以上 —— 画像再准，池子里也没人了。</div></div>`:''}
    <div class="rcard" style="margin-top:${buried||dead.length>rows.length*0.6?'12':'20'}px">
      <div class="rh">先面这 ${N} 个</div>
      ${live.slice(0,N).map((r,i)=>item(r,i,0)).join('')}
      ${live.length>N?`<div class="cut">其余 ${live.length-N} 份</div>${live.slice(N).map((r,i)=>item(r,i,N)).join('')}`:''}
      ${dead.length?`<div class="cut">被硬性条件卡掉 ${dead.length} 份</div>${dead.map((r,i)=>item(r,i,0)).join('')}`:''}
    </div>
    <div class="ev" style="margin-top:14px;max-width:60ch">
      分数来自滑卡学到的权重。
      抽取为规则匹配，可换 LLM。
    </div>`;
}
function cvText(c){
  const L=[`${c.name}　${c.age}岁　求职意向：${c.intent}`,``,`【教育背景】`,
    SOC()?`${c.school}　${c.major}　本科`:`${c.school}　${c.major}　本科　${c.grad}　GPA ${c.gpa}/4.0　专业排名前 ${c.rank}%`];

  L.push(``,SOC()?`【工作经历】`:`【实习经历】`,`${c.exp1.co}　${c.exp1.role}　${c.exp1.dur}`,...c.exp1.lines.map(x=>'· '+x));
  if(c.exp2) L.push(`${c.exp2.co}　${c.exp2.role}　${c.exp2.dur}`,...c.exp2.lines.map(x=>'· '+x));
  if(c.style!=='terse') L.push(``,`【项目经历】`,`${c.proj.title}　${c.proj.line}`);
  L.push(``,`【技能与证书】`,
    `${c.code.length?'编程：'+c.code.join('、')+'　':''}英语${c.en==='工作'?'可工作':c.en==='日常'?'可日常沟通':'一般'}${c.jp?'、日语'+c.jp:''}${c.fr?'、法语熟练':''}${c.certs.length&&c.style!=='terse'?'　'+c.certs.join('、'):''}`,
    `工具：${c.skill.slice(0,c.style==='terse'?3:6).join('、')}`);
  if(S.year==='实习') L.push(`每周可到岗 ${c.onsite} 天`);

/* 一份真实简历 → 一张可以滑的卡。形状和合成卡完全一致，下游一个字不用改 */
function cardFromCV(txt, jobTk, id){
  const e=extract(txt, jobTk);
  const lines=txt.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const eduI=lines.findIndex(l=>/大学|学院|University|College/i.test(l));
  const edu=eduI>=0?lines[eduI]:'';
  const expI=lines.findIndex(l=>/实习|Intern/i.test(l)&&!/求职意向/.test(l)&&!/^[【\[]/.test(l)&&!/^[·\-•*]/.test(l));
  const bl=lines.filter(l=>/^[·\-•*]/.test(l)).map(l=>l.replace(/^[·\-•*]\s*/,''));
  // 专业：学校名之后取第一个像专业的词；同行没有就看教育背景的下一行。
  // 不再要求「以学/工程结尾 + 两侧空白 + 纯中文」—— 人工智能 / 行尾专业 / 分行排版 / 英文专业都收得进来
  const majorTxt=(()=>{
    const DEG=/^(本科|硕士|研究生|博士|学士|在读|大[一二三四]|GPA|绩点|排名|专业排名|20\d{2}|届|至今|预计|毕业|学历)/;
    const scan=s=>{
      if(!s) return '';
      for(const t of s.split(/[\s\u3000·|｜,，;；\/、\-—–()（）]+/)){
        const w=t.trim();
        if(!w||DEG.test(w)) continue;
        if(/大学|学院|University|College|中学|校区|分校/i.test(w)) continue;
        if(/^[\u4e00-\u9fa5]{2,16}$/.test(w)) return w;
      }
      const en=s.match(/[A-Z][A-Za-z]+(?: (?:of |and |& )?[A-Za-z]+){0,4}/);
      return en && !/University|College|School/i.test(en[0]) ? en[0] : '';
    };
    const after=edu.replace(/^.*?(大学|学院|University|College)/i,'');
    const next=lines[eduI+1]||'';
    return scan(after) || (!/实习|经历|工作|项目|【/.test(next) ? scan(next) : '') || '';
  })().slice(0,20);
  const tags=[...e.code];
  if(e.en==='工作') tags.push('英语可工作'); if(e.jp) tags.push('日语'+e.jp);
  if(e.d.z01==='yes') tags.push('0→1');
  if(e.d.proof==='quant') tags.push('有量化结果'); else if(e.d.proof==='work') tags.push('有作品');
  return {
    id, real:true, raw:txt, d:e.d, code:e.code, en:e.en, jp:e.jp, fr:e.fr,
    months:e.months, onsite:e.onsite, age:e.age, name:e.name,
    school:((edu.match(/^(.*?(?:大学|学院|University|College))/i)||[])[1]||edu.split(/[\s\u3000]+/)[0]||'—').trim(), major:majorTxt||'', 
    grad:(txt.match(/20\d{2}\.\d{2}\s*毕业/)||[`${e.age} 岁`])[0],
    gpa:(edu.match(/GPA\s*([\d.]+)/)||[])[1]||'—', rank:(edu.match(/前\s*(\d+)%/)||[])[1]||'—',
    av:id%8, ini:(e.name||'?').slice(0,1), tk:trackOf(txt)||jobTk,
    exp1:{co:(expI>=0?lines[expI]:'—').replace(/[\s\u3000]{2,}/g,'　').trim().slice(0,42).replace(/[·・\s\u3000]+$/,''),
          role:'', dur:`共 ${e.months} 个月`,
          lines:[bl[0]||'（简历里没写具体做了什么）', bl[1]||'', bl[2]||'']},
    exp2:null, skill:tags.length?tags:['—'], style:'real'
  };
}
function demoCVs(n){

function mergePresets(list){
  const F=blankF(), notes=[];
  for(const ps of list){
    F.age[0]=Math.max(F.age[0],ps.F.age[0]);  F.age[1]=Math.min(F.age[1],ps.F.age[1]);
    F.months[0]=Math.max(F.months[0],ps.F.months[0]); F.months[1]=Math.min(F.months[1],ps.F.months[1]);
    for(const k of ['school','lang','code','onsite'])
      for(const v of ps.F[k]||[]) if(!F[k].map(String).includes(String(v))) F[k].push(v);
    for(const kw of ps.F.kws||[])
      if(!F.kws.some(x=>x.t===kw.t&&x.neg===kw.neg)) F.kws.push({...kw});
    for(const n of ps.notes||[]) notes.push(n);
  }
  if(F.age[0]>F.age[1]) F.age=[Math.min(F.age[0],F.age[1]),Math.max(F.age[0],F.age[1])];
  if(F.months[0]>F.months[1]) F.months=[Math.min(F.months[0],F.months[1]),Math.max(F.months[0],F.months[1])];
  return {F,notes};
}

function poolBase(title,role,stage){

  const bases={'产品':[268,296],'研发':[126,168],'运营':[202,238],'设计':[92,118],'市场':[150,170],'职能':[110,120]};

  const gen=(+el.dataset.tw||0)+1; el.dataset.tw=gen;      // 新动画作废旧动画，防两个循环抢写

    const k=Math.min(1,(t-t0)/550);

}

function detectSel(jd){
  const det={};
  let tk=trackOf(jd);
  if(!tk){                                                // JD 里明写赛道名：计分取最多者，别被顺带一提的词抢走
    const alias={ai:['AI','Agent','大模型','LLM','智能'],ecom:['电商','交易'],social:['社区','内容'],saas:['企业服务','SaaS']};
    let bt=null,bs=0;
    for(const k in TRACKS){
      let c0=0;
      for(const w of [...TRACKS[k].name.split(/[\s/]+/),...(alias[k]||[])])
        if(w.length>1||w==='AI') c0 += jd.split(w).length-1;
      if(c0>bs){bs=c0;bt=k}
    }
    tk=bt;
  }
  if(tk){ S.tk=tk; det.tk=1;
          [...$('#f-track').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===tk)); }
  // 第一轮：明确岗位名直接定案（标题信号最强）
  for(const [re,role] of [
      [/产品经理|产品实习生|产品负责人|数据分析师/,'产品'],
      [/(后端|前端|客户端|全栈|算法|推荐|机器学习|推理系统|大模型|测试)[^，。\n]{0,6}(工程师|开发实习生|实习生)|开发工程师|研发工程师|测试开发/,'研发'],
      [/设计师/,'设计'],
      [/运营(实习生|专员|经理|负责人)/,'运营']])
    if(re.test(jd)){ S.role=role; det.role=1;
      [...$('#f-role').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===role));
      renderSub(); break; }
  // 第二轮兜底：组合词弱信号 ——「和研发团队协作」「设计背景加分」这类顺带一提不算
  if(!det.role) for(const [re,role] of [[/测试开发|测开|QA|算法工程|算法研究|Algorithm|基模|后训练|Post-?Training|推荐系统|研发工程|开发工程师|后端|前端|客户端|全栈|数据研发|数仓/i,'研发'],
                          [/市场类|品牌营销|公关|增长营销|市场负责人/,'市场'],[/运营(实习生|专员|经理|负责人|类)|内容运营|用户运营|商家运营|产品运营/,'运营'],[/设计师|UI|UX|视觉设计/i,'设计'],
                          [/HR|人力资源|财务|法务|行政/i,'职能'],[/产品|增长/,'产品']])
    if(re.test(jd)){ S.role=role; det.role=1;
      [...$('#f-role').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===role));
      renderSub(); break; }
  for(const [re2,sub] of [[/测试开发|测开|QA/i,'测试开发'],
      [/基模|预训练|pretrain|后训练|对齐|RLHF|SFT|大模型/i,'算法 · 基模 / 后训练'],
      [/推荐系统|搜索算法/,'算法 · 推荐 / 搜索'],
      [/前端|Web ?端/i,'前端'],[/客户端|iOS|Android/i,'客户端'],[/数仓|数据研发/,'数据研发'],[/后端|服务端/,'后端'],
      [/ToB|B ?端|企业客户|商家侧/i,'ToB'],[/ToC|C ?端|消费者/i,'ToC'],
      [/平台型|中台/,'平台 / 中台']])
    if(re2.test(jd)&&(SUBROLE[S.role]||[]).includes(sub)){ S.sub=sub; S.subKnown=true; det.sub=1; renderSub(); break; }
  const st = /实习生|ByteIntern|实习招聘|个月实习/.test(jd) ? '实习'
           : /校园招聘|校招|应届|\d{2}届/.test(jd) ? '校招'
           : /社招|社会招聘|年以上|资深|负责人|多年经验/.test(jd) ? '社招' : (/实习/.test(jd)?'实习':null);
  if(st){ S.year=st; det.stage=1;
          [...$('#f-year').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===st)); }

  return det;
}

function updateConf(det){

  const Q={role:'招的是什么职能？',stage:'招实习、校招还是社招？',tk:'业务属于哪个赛道？'};
  const missing=[['role'],['stage'],['tk']].filter(([k])=>!S.det[k]);
  renderSum(null);
  // 粗筛：答过的行留着（向下累积），当前问题追加在下；全答完就地出数字
  const rows=$$('#selrows .selrow');

  if(coreOK!==S.jobLocked){ S.jobLocked=coreOK; renderMode(); if(S.jobLocked) renderSrc(); }
  if(det&&Object.keys(S.det||{}).some(k=>S.det[k])&&$('#nmnear')) $('#nmnear').style.display='none';
  // 全部撤回（JD 清空 / 粗筛全取消）→ 建议区回来
  if($('#nmnear') && !Object.keys(S.ans||{}).length && !$('#jd').value.trim()
     && !(det&&Object.keys(det).some(k=>det[k]))) $('#nmnear').style.display='';

function parseJDText(jd){
  if(/^https?:\/\/\S+$/i.test(jd)){
    $('#jdout').innerHTML='<div class="lwhy">读链接需要后端抓取 —— 先把 JD 文字粘进来。</div>';
    return;
  }
  if(jd.length<3){
    $('#jdout').innerHTML='';
    if(S.jdApplied && !(S.pickedJobs&&S.pickedJobs.length)){
      S.jdApplied=false; S.jdF=null; S.F=blankF(); S.Fdraft=blankF();
      S.det={}; S.ans={}; S.jobLocked=false; S.selTouched=false;
      renderMode(); renderSum(); updateConf(null);
    }
    return;
  }
  const got=[];
  const det=detectSel(jd);
  const F=blankF();
  const code=['Python','SQL','Java','Go','JS/TS','C++'].filter(c=>
    new RegExp(c==='C++'?'C\\+\\+':c==='JS/TS'?'\\b(JS|TS)\\b|JavaScript|TypeScript|React|Vue':c,'i').test(jd));
  if(code.length){ F.code=code; got.push(['编程语言',code.join(' + ')]); }
  if(/985|211|双一流|名校/.test(jd)){ F.school=['t1','t2']; got.push(['院校','985 / 211']); }
  else if(/QS ?\d|海外|留学/.test(jd)){ F.school=['t1','sea']; got.push(['院校','头部 / 海外']); }
  if(/英语.{0,4}(可工作|工作|流利)|雅思|托福/.test(jd)){ F.lang=['en_work']; F.langText='英语可工作'; got.push(['语言','英语可工作']); }
  else if(/英语|CET|六级/.test(jd)){ F.lang=['en_daily']; F.langText='英语可日常'; got.push(['语言','英语可日常']); }
  const ag=jd.match(/(\d{2})\s*[-–~到]\s*(\d{2})\s*岁|(\d{2})\s*岁以下/);
  if(ag){ F.age=ag[3]?[18,+ag[3]]:[+ag[1],+ag[2]]; got.push(['年龄',`${F.age[0]}–${F.age[1]} 岁`]); }
  if(jd.length<50){                       // 不足 50 字：只提示，不动任何已生效条件
    $('#jdout').innerHTML=`<div class="ev" style="color:var(--warn)">信息太少，请补充职责和要求（50 字以上）。</div>`;
    return;
  }
  S.jdF=F;
  S.F=JSON.parse(JSON.stringify(F));      // JD 的硬条件当场生效，后续收窄在其上叠加
  S.Fdraft=JSON.parse(JSON.stringify(F));
  // 够长就当真 JD：直接锁岗载入简历池。识别不出的职能/阶段用当前值兜底，
  // 只剩下的缺项走问句，不允许 updateConf 把锁撤回去
  det.role=det.role||1; det.stage=det.stage||1;
  S.selTouched=true; S.jdApplied=true;
  S.jobLocked=true; renderMode(); renderSrc(); renderSum();
  // JD 一改，池子跟着变：按最新岗位重建预览池，按硬条件过滤计数
  S.deckForJob=null; ensureDeckPreview();
  const fitN=S.deck.filter(c=>passes(c,S.F)).length;
  tweenNum($('#libtotal'), fitN);
  $('#libhint').textContent=activeCount(S.F)?' · 符合 JD 要求':' · 匹配本岗位';
  $('#jdout').innerHTML =
    `<div class="ev" style="color:var(--pick)">✓ 已按 JD 载入 ${fitN} 份简历${activeCount(S.F)?`，硬性条件生效 ${activeCount(S.F)} 条`:''}</div>`
    + (got.length?`<div class="ev" style="line-height:2.1;margin-top:6px">${got.map(([k,v])=>`<span class="tag" style="margin:3px 4px 0 0">${k} · ${v}</span>`).join('')}</div>`:'');
  updateConf(det);
}

    const st=S.starStatus[c.name]||'待约';
    return `<div class="sec ss-star" data-ssn="${c.name}" draggable="true" style="cursor:pointer">
      <div style="display:flex;gap:10px;align-items:center">
        <div style="flex:1;min-width:0">
          <div class="bv" style="font-weight:600;font-size:15.5px"><span class="sr-grip" style="cursor:grab;color:var(--ink4);margin-right:6px">⠿</span><span style="font-family:var(--serif);font-size:14px;color:var(--ink3);margin-right:7px">${i+1}</span>${c.name}<span style="color:var(--ink3);font-weight:400;font-size:13px"> · ${c.school} · ${c.exp1.co}</span></div>
          <input class="sr-note ssn-note" data-n="${c.name}" placeholder="亮点备注" style="margin-top:7px"
            value="${(S.starNotes[c.name]||'').replace(/"/g,'&quot;')}">
        </div>
        ${c._imp?`<button class="tbtn ss-rm" data-n="${c.name}">移除</button>`:`<button class="tbtn ss-down" data-n="${c.name}">移到可聊</button>`}
      </div>
      <div class="ss-st">${['待约','已约面','已面试','通过'].map(x=>
        `<button class="chip ss-set" data-n="${c.name}" data-st="${x}" aria-pressed="${st===x}">${x}</button>`).join('')}</div>
    </div>`;
  };
  $('#sslist').innerHTML=
    `<div class="rh" style="font-size:13px;color:var(--ink)">✦ 直接约面${orderedStars.length>1?' · 拖动排优先级':''}</div>`
    +(orderedStars.map(starRow).join('')
      ||'<div class="ev" style="margin-bottom:8px;font-size:14px">还没有，上滑或点 ✦ 选中。</div>')
    +`<div class="rh" style="margin-top:14px;font-size:13px;color:var(--ink)">✓ 可以聊</div>`
    +(yes.map(c=>row(c,`<button class="tbtn ss-up" data-n="${c.name}">✦ 约面</button>`)).join('')
      ||'<div class="ev" style="font-size:14px">还没有。</div>');
  let dsn=null;
  $('#sslist').querySelectorAll('.ss-star[draggable]').forEach(r2=>{
    r2.addEventListener('dragstart',e=>{ dsn=r2.dataset.ssn; e.dataTransfer.effectAllowed='move'; });
    r2.addEventListener('dragover',e=>{ e.preventDefault(); r2.classList.add('dragover'); });
    r2.addEventListener('dragleave',()=>r2.classList.remove('dragover'));
    r2.addEventListener('drop',e=>{
      e.preventDefault(); r2.classList.remove('dragover');
      if(!dsn||dsn===r2.dataset.ssn) return;
      const o=S.starOrder, from=o.indexOf(dsn), to=o.indexOf(r2.dataset.ssn);
      o.splice(to,0,o.splice(from,1)[0]); renderStarSheet();
    });
  });
  $('#sslist').querySelectorAll('.ssn-note').forEach(inp=>{
    for(const ev of ['click','pointerdown']) inp.addEventListener(ev,e=>e.stopPropagation());
    inp.addEventListener('input',()=>{ S.starNotes[inp.dataset.n]=inp.value; });
  });
}
$('#starbtn').onclick=()=>{ renderStarSheet(); $('#ssheet').classList.add('on'); };
$('#sslist').addEventListener('click',e=>{
  const st=e.target.closest('.ss-set');
  if(st){ e.stopPropagation(); (S.starStatus=S.starStatus||{})[st.dataset.n]=st.dataset.st; renderStarSheet(); return; }
  const rm=e.target.closest('.ss-rm');
  if(rm){ e.stopPropagation();
    S.importedStars=(S.importedStars||[]).filter(x=>x.n!==rm.dataset.n);
    S.importedYes=(S.importedYes||[]).filter(x=>x.n!==rm.dataset.n);
    tick(); renderStarSheet(); return; }
  const up=e.target.closest('.ss-up'), dn=e.target.closest('.ss-down');
  if(up||dn){
    e.stopPropagation();
    const nm=(up||dn).dataset.n;
    const d=S.decisions.find(x=>x.card.name===nm);
    if(d){ d.v=up?'star':'yes'; refit(); tick(); renderStarSheet(); return; }
    const iy=(S.importedYes||[]).find(x=>x.n===nm), is2=(S.importedStars||[]).find(x=>x.n===nm);
    if(up&&iy){ S.importedYes=S.importedYes.filter(x=>x.n!==nm); S.importedStars=[...(S.importedStars||[]),iy]; }
    if(dn&&is2){ S.importedStars=S.importedStars.filter(x=>x.n!==nm); S.importedYes=[...(S.importedYes||[]),is2]; }
    tick(); renderStarSheet();
    return;
  }
});
$('#ss-copy').onclick=async()=>{
  let st=[...S.decisions.filter(d=>d.v==='star').map(d=>d.card),
            ...(S.importedStars||[]).map(r=>({name:r.n, school:r.sc, exp1:{co:r.co}}))];
  if(S.starOrder&&S.starOrder.length)
    st=st.slice().sort((a,b)=>S.starOrder.indexOf(a.name)-S.starOrder.indexOf(b.name));
  const ys=[...S.decisions.filter(d=>d.v==='yes').map(d=>d.card),
            ...(S.importedYes||[]).map(r=>({name:r.n, school:r.sc, exp1:{co:r.co}}))];
  const t=`【约面清单 · ${$('#jobtag').textContent.split('　')[0]}】\n\n直接约面：\n`
    +st.map((c,i)=>`${i+1}. ${c.name} · ${c.school} · ${c.exp1.co} · ${(S.starStatus||{})[c.name]||'待约'}${(S.starNotes||{})[c.name]?` —— ${S.starNotes[c.name]}`:''}`).join('\n')
    +(ys.length?`\n\n可以聊：\n`+ys.map(c=>`· ${c.name} · ${c.school} · ${c.exp1.co}`).join('\n'):'');
  try{ await navigator.clipboard.writeText(t); $('#ss-copy').textContent='已复制';
       setTimeout(()=>$('#ss-copy').textContent='复制',1500); }catch(_){}
};
$('#ss-close').onclick=()=>$('#ssheet').classList.remove('on');
$('#ssheet').addEventListener('pointerdown',e=>{ if(e.target.id==='ssheet') $('#ssheet').classList.remove('on'); });
$('#sslist').addEventListener('click',e=>{
  const r=e.target.closest('[data-ssn]'); if(!r) return;
  const c=S.decisions.find(d=>d.card.name===r.dataset.ssn)?.card;
  if(c){ $('#ssheet').classList.remove('on'); openSheet(c); }
});
$('#backbtn').onclick=()=>show('landing');
$('#b-no').onclick=()=>decide('no');
$('#b-yes').onclick=()=>decide('yes');
$('#b-star').onclick=()=>decide('star');
$('#b-undo').onclick=undo;
$('#donebtn').onclick=()=>{render();show('result');window.scrollTo(0,0)};
$('#histlink').onclick=()=>{ $('#filterbtn').click(); setTimeout(()=>$('#memhist')?.scrollIntoView({behavior:'smooth',block:'center'}),350); };
function widenFresh(){
  const seen=new Set([...S.decisions.map(d=>d.card.name),...S.stack.map(x=>x.card.name)]);
  const raw=poolDocs();
  const all=raw.length ? raw.map((d,i)=>({...cardFromCV(d.text,S.tk,i), src:d.src})) : S.deck0;
  return all.filter(c=>!seen.has(c.name)&&!memExcluded(c));        // 「不要这样的」记忆仍然生效
}
function widenPool(){
  const fresh=widenFresh();
  if(fresh.length<=S.pool.length){ $('#lwhy').textContent='库里没有更多本岗位的简历了。'; $('#lwhy').style.display='block'; setTimeout(()=>$('#lwhy').style.display='none',4000); return; }
  const hadF=activeCount(S.F);
  S.F=blankF(); S.Fdraft=blankF();
  S.deck=[...S.decisions.map(d=>d.card),...S.stack.map(x=>x.card),...fresh];
  S.pool=fresh;
  if(REAL()) $('#jobtag').textContent=$('#jobtag').textContent.replace(/　\d+\/\d+$/,`　${S.deck.length}/${S.realTotal}`);
  fill(); tick();
  $('#lwhy').textContent=`已扩大到本岗位全部 ${S.deck.length} 份。`+(hadF?`原有 ${hadF} 条硬性条件已清空。`:''); $('#lwhy').style.display='block';
  setTimeout(()=>$('#lwhy').style.display='none',4000);
}
document.addEventListener('click',e=>{ if(e.target.id==='lwiden') widenPool(); });
$('#emptywiden').onclick=widenPool;
$('#emptydone').onclick=()=>{render();show('result');window.scrollTo(0,0)};
addEventListener('keydown',e=>{
  if(!$('#deck').classList.contains('on')) return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.isContentEditable) return;
  if($('#sheet').classList.contains('on')){ if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();$('#sheet').classList.remove('on')} return; }
  const m={ArrowLeft:'no',ArrowRight:'yes',ArrowUp:'star'}[e.key];
  if(m){e.preventDefault();decide(m)}
  else if(e.key.toLowerCase()==='z'){e.preventDefault();undo()}
  else if(e.key==='Enter'){e.preventDefault(); if(S.stack.length) openSheet(S.stack[0].card)}
});
tick();
</script>

</body>
</html>
