<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,540&display=swap" rel="stylesheet">
<title>画像滑卡</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* ============================== TOKENS ==============================
   Editorial Paper：纸白底、油墨炭灰字。强调只通过墨色的面积、字重和实度
   表达，不引入第二种品牌色。有色相只回答「现在是什么状态」。
   夜间用深灰不用纯黑，字用软白。
   ==================================================================== */
:root{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#fbfbfb; --sunk:#f7f7f7;
  --ink:#1d1d1d; --ink-solid:#1d1d1d;
  --ink2:rgba(29,29,29,.64); --ink3:rgba(29,29,29,.44); --ink4:rgba(29,29,29,.28);
  --line:rgba(227,227,227,.95); --line2:rgba(234,234,234,.9);
  --tint:rgba(29,29,29,.045); --tint2:rgba(29,29,29,.08);
  /* 语义色只有三种状态：否 / 是 / 警告。★ 不给色相，用实心墨色表达最强 */
  --pass:#b0433c; --pick:#1d1d1d; --warn:#8a5a1f;
  --sh-card:0 1px 1px rgba(29,29,29,.04), 0 6px 16px rgba(29,29,29,.06), 0 22px 50px rgba(29,29,29,.05);
  --sh-btn:0 1px 2px rgba(29,29,29,.05), 0 3px 10px rgba(29,29,29,.07);
  --r:20px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"Fraunces",Georgia,-apple-system,"PingFang SC","Noto Sans SC",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --panel:#202020; --panel-2:#1c1c1c; --sunk:#161616;
  --ink:rgba(255,255,255,.92); --ink-solid:#ffffff;
  --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.42); --ink4:rgba(255,255,255,.26);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.065);
  --tint:rgba(255,255,255,.055); --tint2:rgba(255,255,255,.10);
  --pass:#e0817a; --pick:rgba(255,255,255,.92); --warn:#d3a35e;
  --sh-card:0 1px 1px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45), 0 30px 64px rgba(0,0,0,.4);
  --sh-btn:0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#191919; --panel:#202020; --panel-2:#1c1c1c; --sunk:#161616;
  --ink:rgba(255,255,255,.92); --ink-solid:#ffffff;
  --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.42); --ink4:rgba(255,255,255,.26);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.065);
  --tint:rgba(255,255,255,.055); --tint2:rgba(255,255,255,.10);
  --pass:#e0817a; --pick:rgba(255,255,255,.92); --warn:#d3a35e;
  --sh-card:0 1px 1px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45), 0 30px 64px rgba(0,0,0,.4);
  --sh-btn:0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.4);
}
/* 兼容旧变量名 */
:root,:root[data-theme="dark"]{ --card:var(--panel); --raise:var(--panel-2); --chip:var(--tint); --chipink:var(--ink2); --star:var(--ink); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  font-size:15px;line-height:1.55;
}
::selection{background:var(--tint2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--tint2);border-radius:5px}
/* 直线上的圆点：离散的规则线。实心 / 空心混排 */
.ruledots{position:relative;height:8px;margin:0 0 24px;max-width:160px}
.ruledots::before{content:"";position:absolute;top:3.5px;left:0;right:0;height:1px;background:var(--line)}
.ruledots i{position:absolute;top:0;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.ruledots i:nth-child(1){left:0}
.ruledots i:nth-child(2){left:36%;width:6px;height:6px;top:1px;background:var(--bg);border:1.5px solid var(--ink)}
.ruledots i:nth-child(3){left:72%}
.ruledots i:nth-child(4){right:0;width:4px;height:4px;top:2px;background:var(--ink3)}

/* 扇形牌堆：产品自己的 hero。纹理全是墨色细线，不引入色相 */
.fan{position:relative;height:104px;margin:6px 0 30px}
.fan i{position:absolute;left:50%;top:6px;width:62px;height:86px;margin-left:-31px;border-radius:9px;
  border:1px solid var(--line2);outline:1px solid var(--line);background-color:var(--panel);box-shadow:var(--sh-card);
  transform-origin:50% 130%;animation:fanIn .8s cubic-bezier(.22,1.1,.35,1) backwards}
.fan i{transform:var(--tr);transition:transform .35s cubic-bezier(.22,1.2,.35,1),box-shadow .35s}
.fan i:nth-child(1){--tr:rotate(-18deg) translateX(-64px);animation-delay:.05s}
.fan i:nth-child(2){--tr:rotate(-9deg) translateX(-32px);animation-delay:.12s}
.fan i:nth-child(3){--tr:rotate(0) translateY(-6px);animation-delay:.19s}
.fan i:nth-child(4){--tr:rotate(9deg) translateX(32px);animation-delay:.26s}
.fan i:nth-child(5){--tr:rotate(18deg) translateX(64px);animation-delay:.33s}
.fan i:hover{transform:var(--tr) translateY(-16px) scale(1.16);z-index:3;box-shadow:var(--sh-card)}
.fmk{cursor:pointer;position:absolute;top:56px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh-btn);z-index:4;
  animation:fanIn .8s cubic-bezier(.22,1.1,.35,1) backwards}
.fmk svg{width:15px;height:15px}
.fmk-x{left:calc(50% - 128px);color:var(--pass);animation-delay:.42s}
.fmk-v{left:calc(50% + 96px);color:var(--ink);animation-delay:.5s}
@media (max-width:480px){ .fmk{width:28px;height:28px;top:50px} .fmk-x{left:calc(50% - 112px)} .fmk-v{left:calc(50% + 84px)} }
.fmk:hover{transform:scale(1.12)}
.fmk:active{transform:scale(.9)}
.fmk{transition:transform .15s cubic-bezier(.3,1.4,.5,1)}
@keyframes flyL{to{transform:translate(-190px,-30px) rotate(-32deg);opacity:0}}
@keyframes flyR{to{transform:translate(190px,-30px) rotate(32deg);opacity:0}}
.fan i.gone-l{animation:flyL .45s cubic-bezier(.5,0,.75,.35) forwards}
.fan i.gone-r{animation:flyR .45s cubic-bezier(.5,0,.75,.35) forwards}
@keyframes backL{from{transform:translate(-190px,-30px) rotate(-32deg);opacity:0}}
@keyframes backR{from{transform:translate(190px,-30px) rotate(32deg);opacity:0}}
.fan i.back-l{animation:backL .6s cubic-bezier(.22,1.1,.35,1) backwards}
.fan i.back-r{animation:backR .6s cubic-bezier(.22,1.1,.35,1) backwards}
@media (prefers-reduced-motion:reduce){.fan i.gone-l,.fan i.gone-r,.fan i.back-l,.fan i.back-r{animation:none}}
@keyframes fanIn{from{transform:rotate(0) translateY(26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fan i{animation:none}}
.tex-v{background-image:repeating-linear-gradient(90deg,var(--ink4) 0 1px,transparent 1px 5px)}
.tex-h{background-image:repeating-linear-gradient(0deg,var(--ink4) 0 1px,transparent 1px 5px)}
.tex-g{background-image:repeating-linear-gradient(90deg,var(--tint2) 0 1px,transparent 1px 6px),repeating-linear-gradient(0deg,var(--tint2) 0 1px,transparent 1px 6px)}
.tex-d{background-image:radial-gradient(var(--ink4) 1.2px,transparent 1.2px);background-size:7px 7px}
.tex-s{background-image:repeating-linear-gradient(45deg,var(--ink4) 0 1px,transparent 1px 6px)}
.tex-k{background:var(--ink)}
.tex-k::after{content:"";position:absolute;inset:8px;border-radius:5px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 5px)}

/* 星形：产品的记号。四角星比五角星更利落，也更像排版里的星标 */
.sparkle{display:inline-block;vertical-align:-.12em;width:1em;height:1em}
.sparkle path{fill:currentColor}
.h1 em{font-style:normal}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{display:none;min-height:100dvh}
.screen.on{display:block}

/* ============================== LANDING ============================== */
#landing{display:none;place-items:center;padding:32px 20px}
#landing.on{display:grid}
.lwrap{width:100%;max-width:520px}
.brand{font-size:11px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:18px;
  display:flex;align-items:center;gap:7px;font-weight:500}
.h1{font-family:var(--display);font-size:clamp(32px,6.6vw,46px);line-height:1.18;letter-spacing:-.01em;font-weight:400;margin:0 0 16px}
.h1 em{font-weight:560;letter-spacing:-.02em}
.sub{color:var(--ink2);margin:0 0 34px;font-size:15.5px;max-width:44ch}
.field{margin-bottom:22px}
.flabel{font-size:12.5px;color:var(--ink3);margin-bottom:9px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.jobrow{display:block;width:100%;text-align:left;
  padding:11px 14px;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  transition:border-color .14s,transform .12s}
.jobrow .jr-t{font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow .jr-m{font-size:12px;color:var(--ink3);margin-top:3px}
.nm-jd{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line2);max-height:220px;overflow-y:auto}
.jr-m .jrn{font-family:var(--display);font-style:normal;font-weight:540;color:var(--ink2)}
.jobrow.picked{position:relative;border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink);cursor:pointer;width:100%}
.jobrow.picked .jr-t{padding-right:28px}
.pk-x{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:8px;color:var(--ink4);font-size:15px;line-height:1}
.pk-x:hover{color:var(--pass);background:var(--tint)}
.jobrow:hover{border-color:var(--ink3);transform:translateY(-1px)}
.jobrow[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.jobrow .jr-meta{margin-left:auto;flex:none;font-size:11.5px;color:var(--ink3)}
#jdview{margin-top:10px;padding:13px 15px;background:var(--sunk);border:1px solid var(--line2);border-radius:12px;
  font-size:12.5px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;max-height:300px;overflow-y:auto}
#jdview:focus{outline:none;border-color:var(--ink3);background:var(--panel);color:var(--ink)}
.selsum{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;font-size:14px}
.selsum b{font-weight:600}
.selsum .linkish{margin-left:auto;flex:none}
.selrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
.selrow:first-child{border-top:0;padding-top:0}
.selk{flex:none;width:34px;font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;
  padding-top:9px;font-weight:500}
.chip{
  padding:8px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink2);font-size:14px;transition:background .16s,color .16s,border-color .16s,transform .12s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{
  margin-top:14px;width:100%;padding:15px;border-radius:11px;background:var(--ink);color:var(--bg);
  font-size:16px;font-weight:600;letter-spacing:.01em;box-shadow:var(--sh-btn);transition:transform .12s,opacity .16s;
}
.go:hover{transform:translateY(-1px);box-shadow:var(--sh-card)}
.go:active{transform:scale(.985)}
.go:disabled{opacity:.35;box-shadow:none;transform:none;cursor:default}
.go{transition:transform .18s cubic-bezier(.3,1,.4,1),box-shadow .18s}
.lib{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.librow{font-size:14px}
.librow b{font-family:var(--display);font-size:22px;font-weight:540;letter-spacing:-.01em}
/* 数字统一用衬线 display 字体 —— 数据也值得好看 */
.fchip i,.counter,#lnum,.score b,.rank,.iv b{font-family:var(--display)}
.fchip i{font-weight:540;opacity:.55;font-size:11.5px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;text-align:center;
  color:var(--ink3);cursor:pointer;font-size:13.5px;line-height:1.7;transition:border-color .15s,color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop.has{border-style:solid;border-color:var(--line)}
.linkish{margin-top:11px;font-size:13px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;display:block}
.linkish:hover{color:var(--ink)}
.foot{margin-top:20px;font-size:12.5px;color:var(--ink4);line-height:1.7}

/* ============================== DECK ============================== */
#deck{padding:0}
.top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:14px 18px 12px;background:linear-gradient(var(--bg) 68%,transparent);
}
.jobtag{font-size:13px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tbtn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);background:var(--card);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbtn.ready{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbtn:disabled{opacity:.35}

.progress{position:relative;height:12px;margin:0 20px}
.progress::before{content:"";position:absolute;top:5.5px;left:0;right:0;height:1px;background:var(--line)}
.progress i{position:absolute;top:5.5px;left:0;height:1px;width:0;background:var(--ink);transition:width .4s cubic-bezier(.3,1,.4,1)}
.progress .nd{position:absolute;top:3px;width:6px;height:6px;border-radius:50%;
  background:var(--bg);border:1px solid var(--ink4);transform:translateX(-50%);transition:background .3s,border-color .3s}
.progress .nd.hit{background:var(--ink);border-color:var(--ink)}
.progress .tip{position:absolute;top:2px;width:8px;height:8px;border-radius:50%;background:var(--ink);
  transform:translateX(-50%);left:0;transition:left .4s cubic-bezier(.3,1,.4,1)}

.deckgrid{display:block}
.stage{
  position:relative;margin:16px auto 0;
  width:min(392px,92vw);height:min(560px,62dvh);
  touch-action:none;
}
.card{
  touch-action:none;
  position:absolute;inset:0;background:var(--panel);border-radius:var(--r);
  box-shadow:var(--sh-card);border:1px solid var(--line);
  will-change:transform,opacity;transform:translate3d(0,0,0);
  contain:layout paint style;overflow:hidden;
  backface-visibility:hidden;
}
.card.anim{transition:transform .44s cubic-bezier(.18,.89,.32,1.12),opacity .28s ease-out}
.card.fly{transition:transform .40s cubic-bezier(.25,.46,.45,.94),opacity .34s linear}
.cin{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 22px 18px;overflow:hidden}
.cin>*{flex-shrink:0}

.chead{display:flex;gap:13px;align-items:flex-start;margin-bottom:14px}
.av{
  width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;
  font-size:17px;font-weight:600;letter-spacing:.02em;
  background:var(--tint2);color:var(--ink);border:1px solid var(--line);
}
.av[data-t="1"],.av[data-t="5"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av[data-t="2"],.av[data-t="6"]{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.av[data-t="3"]{background:var(--tint);border-style:dashed}
.av[data-t="4"]{background-image:repeating-linear-gradient(90deg,var(--tint2) 0 1px,transparent 1px 4px)}
.av[data-t="7"]{background-image:radial-gradient(var(--tint2) 1.2px,transparent 1.2px);background-size:6px 6px}
.nm{font-family:var(--display);font-size:21px;font-weight:540;letter-spacing:-.01em;line-height:1.2}
.mt{font-size:13px;color:var(--ink3);margin-top:3px}
.synth{margin-left:auto;font-size:10px;color:var(--ink4);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.card:has(.synth) .synth{letter-spacing:.02em}

.blk{position:relative;padding:11px 0;border-top:1px solid var(--line2)}
.blk:first-of-type{border-top:0}
.bk{font-size:10.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-bottom:5px;font-weight:500}
.bv{font-size:14.5px;color:var(--ink);line-height:1.5}
.bd{font-size:13px;color:var(--ink2);line-height:1.62;margin-top:5px}
.bd li{margin:3px 0 0;list-style:none;padding-left:13px;position:relative}
.bd li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--ink4)}
.blur{filter:blur(6px);opacity:.55;transition:filter .2s}

.pins{position:absolute;top:8px;right:0;display:flex;gap:5px;opacity:.32;transition:opacity .16s}
.blk:hover .pins,.blk.has .pins,.sec .pins{opacity:1}
.pinbtn{
  width:25px;height:25px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:13px;color:var(--ink3);line-height:1;transition:all .14s;
}
.pinbtn:active{transform:scale(.9)}
.blk.plus{box-shadow:inset 3px 0 0 var(--pick);padding-left:11px;margin-left:-11px}
.blk.minus{box-shadow:inset 3px 0 0 var(--pass);padding-left:11px;margin-left:-11px}
.blk.plus .pinbtn.p{background:var(--pick);color:#fff;border-color:var(--pick)}
.blk.minus .pinbtn.m{background:var(--pass);color:#fff;border-color:var(--pass)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:14px}
.tag{font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--tint);color:var(--ink2)}
.hint{text-align:center;font-size:11.5px;color:var(--ink4);margin-top:12px}
.card.behind .hint,.card.behind .pins{opacity:0}

.side{
  position:absolute;top:50%;transform:translateY(-50%);z-index:24;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh-btn);
  opacity:.55;transition:opacity .16s,transform .16s;
}
.side svg{width:19px;height:19px}
.side-x{left:-62px;color:var(--pass)}
.side-v{right:-62px;color:var(--ink)}
.side:hover{opacity:1;transform:translateY(-50%) scale(1.08)}
.side:active{transform:translateY(-50%) scale(.9)}
@media (max-width:600px){.side{display:none}}
.stamp{
  position:absolute;top:82px;padding:7px 14px;border-radius:10px;border:2.5px solid;
  font-size:16px;font-weight:800;letter-spacing:.08em;opacity:0;pointer-events:none;
  will-change:opacity,transform;
}
.stamp.s-no{left:22px;color:var(--pass);border-color:var(--pass);transform:rotate(-13deg)}
.stamp.s-yes{right:22px;color:var(--pick);border-color:var(--pick);transform:rotate(13deg)}
.stamp.s-star{left:50%;top:auto;bottom:26px;margin-left:-52px;color:var(--bg);border-color:var(--ink);background:var(--ink)}

.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;color:var(--ink3)}

/* controls */
.ctrls{display:flex;justify-content:center;align-items:center;gap:14px;padding:22px 0 8px}
.cb{
  width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-btn);font-size:22px;line-height:1;
  transition:transform .14s cubic-bezier(.3,1.4,.5,1),background .16s;
}
.cb:active{transform:scale(.88)}
.cb.sm{width:44px;height:44px;font-size:16px}
.cb.no{color:var(--pass)} .cb.yes{color:var(--pick)}
.cb.st{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cb.st svg{fill:var(--bg);width:20px;height:20px}
.stamp.s-star svg{width:14px;height:14px;margin-right:2px}
.cb:disabled{opacity:.3;box-shadow:none}
/* 左右滑卡按钮 —— 悬浮在卡片下缘两角，主流 dating app 布局 */
.cb.big{width:64px;height:64px}
.keys{text-align:center;font-size:11.5px;color:var(--ink4);padding-bottom:26px}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink3);background:var(--card)}

/* ============================== SHEET (full resume) ============================== */
.duel{position:fixed;inset:0;z-index:88;display:none;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.duel.on{display:grid;place-items:center;padding:20px}
.dpanel{width:min(430px,94vw);background:var(--bg);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px;box-shadow:var(--sh-card)}
.dtitle{font-family:var(--display);font-size:17px;font-weight:540;margin-bottom:13px;text-align:center}
.dcards{display:grid;gap:10px}
.dwrap{position:relative}
.dwrap .dcard{width:100%;padding-right:76px}
.dpeek{position:absolute;top:10px;right:10px;font-size:11.5px;color:var(--ink3);
  border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--panel)}
.dpeek:hover{color:var(--ink);border-color:var(--ink3)}
.dcard{text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);
  transition:transform .14s,border-color .14s}
.dcard:hover{border-color:var(--ink);transform:translateY(-1px)}
.dcard b{font-family:var(--display);font-size:16px}
.dcard .dm{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:80;
  visibility:hidden;
  width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:15px 17px;box-shadow:var(--sh-card);
  transition:transform .45s cubic-bezier(.22,1.1,.35,1);
}
.toast{transition:transform .45s cubic-bezier(.22,1.1,.35,1),visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.22,1.1,.35,1)}
.tmsg{font-size:14.5px;line-height:1.55}
.tacts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
#selpop{
  position:fixed;z-index:99;display:flex;gap:6px;align-items:center;
  background:var(--ink);border-radius:12px;padding:7px 8px;box-shadow:var(--sh-card);
}
#selpop button{padding:7px 12px;border-radius:9px;font-size:13px;line-height:1;color:var(--bg);flex:none;white-space:nowrap}
#selpop-yes:hover{background:color-mix(in srgb,var(--pick) 55%,var(--ink))}
#selpop-no:hover{background:color-mix(in srgb,var(--pass) 55%,var(--ink))}
.sheet{
  position:fixed;inset:0;z-index:90;display:none;
  background:rgba(21,19,15,.34);
}
.sheet.on{display:block}
#ssheet.on,#jsheet.mid.on{display:grid;place-items:center;padding:20px}
#jsheet.mid .spanel{position:static;transform:none;border-radius:18px;width:min(560px,94vw);max-height:82dvh}
#fsheet .spanel{
  left:0;bottom:0;top:0;transform:translateX(-100%);
  width:min(420px,94vw);max-height:none;height:100dvh;
  border-radius:0 22px 22px 0;
}
#fsheet.on .spanel{transform:translateX(0)}
#ssheet .spanel{position:static;transform:none;border-radius:18px;width:min(500px,94vw);max-height:82dvh}
#sslist .sec.ss-star{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
#sslist .sec.dragover{box-shadow:inset 0 2px 0 var(--ink)}
#sslist .sec.ss-yes{background:var(--sunk);border-color:var(--line2)}
#sslist .sec.ss-yes .bv{font-weight:500;color:var(--ink2)}
.ss-st{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ss-st .chip{font-size:11.5px;padding:4px 10px}
.spanel{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);
  width:min(560px,100%);max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:24px 24px 0 0;padding:0 22px 34px;
  transition:transform .38s cubic-bezier(.22,.9,.3,1);
}
.sheet.on .spanel{transform:translate(-50%,0)}
.shead{position:sticky;top:0;background:var(--bg);padding:16px 0 12px;display:flex;align-items:center;gap:10px;z-index:2}
.grip{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:4px;background:var(--line)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative}
.sec .pins{top:12px;right:14px;opacity:1}
.rlh{font-size:11px;letter-spacing:.12em;color:var(--ink3);margin:12px 0 2px;font-weight:500}
.rl{position:relative;padding:5px 64px 5px 0;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink2);border-top:0}
.rl .pins{top:4px;right:0;opacity:0}
.rl:hover .pins,.rl.has .pins{opacity:1}
.rl.plus{box-shadow:inset 3px 0 0 var(--pick);padding-left:10px}
.rl.minus{box-shadow:inset 3px 0 0 var(--pass);padding-left:10px}
.sec.plus{box-shadow:inset 3px 0 0 var(--pick)}
.sec.minus{box-shadow:inset 3px 0 0 var(--pass)}
.sec.plus .note,.sec.minus .note,.sec .note:not(:placeholder-shown){display:block}
.note{
  display:none;
  width:100%;margin-top:10px;padding:10px 12px;border-radius:11px;border:1px dashed var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical;min-height:38px;
}
.note::placeholder{color:var(--ink4)}
.note:focus{outline:none;border-style:solid;border-color:var(--ink3)}

/* ============================== 筛简历 ============================== */
.cvwrap{max-width:760px;margin:0 auto;padding:26px 20px 70px}
.cvin{
  width:100%;min-height:180px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:13px;line-height:1.65;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.cvin:focus{outline:none;border-color:var(--ink3)}
.cvrow{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line2)}
.rank{font-size:19px;font-weight:640;color:var(--ink4);width:30px;flex:none;font-variant-numeric:tabular-nums}
.cvbody{flex:1;min-width:0}
.cvname{font-size:15.5px;font-weight:600}
.cvsig{font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.6}
.sig{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;margin:2px 4px 0 0}
.sig.p{background:color-mix(in srgb,var(--pick) 14%,transparent);color:var(--pick)}
.sig.n{background:color-mix(in srgb,var(--pass) 14%,transparent);color:var(--pass)}
.sig.x{background:var(--chip);color:var(--ink4)}
.score{width:64px;flex:none;text-align:right}
.score b{font-size:19px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score .sb{height:4px;border-radius:4px;background:var(--line2);margin-top:5px;overflow:hidden}
.score .sb i{display:block;height:100%;border-radius:4px}
.cut{
  display:flex;align-items:center;gap:10px;margin:16px 0 2px;font-size:12px;
  letter-spacing:.1em;color:var(--ink4);text-transform:uppercase;
}
.cut::after{content:"";flex:1;height:1px;background:var(--line)}
.dead{opacity:.45}

/* ============================== RESULT ============================== */
#result{padding:0 0 60px}
.rwrap{max-width:660px;margin:0 auto;padding:26px 20px}
.rtitle{font-family:var(--display);font-size:clamp(26px,5vw,36px);font-weight:420;letter-spacing:-.015em;margin:0 0 6px}
.conf{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink3);margin-bottom:24px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pick)}
.srow{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel);overflow:hidden}
.srow.dragover{border-color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
.sr-head{display:flex;gap:10px;align-items:center;padding:11px 13px;cursor:grab;user-select:none}
.sr-head:active{cursor:grabbing}
.sr-grip{color:var(--ink4);flex:none;font-size:14px}
.sr-rank{font-family:var(--display);font-weight:540;width:18px;flex:none;color:var(--ink3)}
.sr-name{font-weight:600}
.sr-meta{color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sr-chev{flex:none;color:var(--ink4);transition:transform .2s}
.srow.open .sr-chev{transform:rotate(180deg)}
.sr-body{display:none;padding:0 13px 12px;border-top:1px solid var(--line2)}
.srow.open .sr-body{display:block}
.sr-cv{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;
  padding:10px 0;max-height:150px;overflow-y:auto}
.sr-note{width:100%;padding:9px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);
  color:var(--ink);font:inherit;font-size:13px}
.sr-note:focus{outline:none;border-style:solid;border-color:var(--ink3)}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:11px}
.rh svg{width:10px;height:10px;margin-right:4px;vertical-align:-.05em}
.rh{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;font-weight:500}
.item{padding:11px 0;border-top:1px solid var(--line2)}
.item:first-of-type{border-top:0;padding-top:0}
.iv{font-size:15.5px;font-weight:550;line-height:1.45}
.ev{font-size:12.5px;color:var(--ink3);margin-top:5px;line-height:1.6}
.bar{height:5px;border-radius:5px;background:var(--line2);margin-top:8px;overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:9px 0;font-size:14px;color:var(--ink2)}
.quote b{color:var(--ink);font-weight:550}
.warn{background:color-mix(in srgb,var(--pass) 8%,var(--card));border-color:color-mix(in srgb,var(--pass) 22%,var(--line2))}
.mono{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border:1px solid var(--line2);padding:12px 14px;border-radius:11px;color:var(--ink2);line-height:1.7;word-break:break-all;white-space:pre-wrap}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.gh{padding:11px 17px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14.5px;font-weight:550}
.gh.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
[contenteditable]:focus{outline:2px solid var(--ink3);outline-offset:4px;border-radius:4px}
@media (max-width:480px){
  .top{padding:10px 14px 8px}
  .stage{height:max(380px, calc(100dvh - 348px)); margin-top:10px}
  .cin{padding:16px 16px 12px}
  .chead{margin-bottom:10px}
  .av{width:42px;height:42px;font-size:15px;border-radius:12px}
  .nm{font-size:19px}
  .blk{padding:8px 0}
  .bv{font-size:13.5px}
  .bd{font-size:12px;line-height:1.55}
  .tags{padding-top:9px}
  .hint{display:none}
  .ctrls{padding:26px 0 6px;gap:12px}
  .cb{width:52px;height:52px;font-size:20px}
  .cb.sm{width:40px;height:40px}
  .learn{margin-top:6px}
  .keys{display:none}
  .fan{height:88px}
  .fan i{width:54px;height:76px;margin-left:-27px}
  .spanel{max-height:96dvh}
}

/* ============================== 学习进度 / 记一笔 ============================== */
.learn{max-width:min(392px,92vw);margin:10px auto 0;font-size:12.5px}
.lrow{display:flex;align-items:center;gap:8px;color:var(--ink3)}
.lbar{flex:1;height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:4px;transition:width .45s cubic-bezier(.3,1,.4,1),background .3s}
.lwhy{
  margin-top:9px;padding:11px 13px;border-radius:13px;background:var(--card);
  border:1px solid var(--line2);color:var(--ink2);line-height:1.6;font-size:12.5px;
}
.lwhy b{color:var(--ink)}
.lwhy button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.think{display:flex;gap:8px;max-width:min(392px,92vw);margin:11px auto 0}
.think input{
  flex:1;padding:11px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:13.5px;
}
.think input::placeholder{color:var(--ink4)}
.think input:focus{outline:none;border-color:var(--ink3)}
.think button{padding:0 15px;border-radius:13px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:550}
.think button:disabled{opacity:.3}
.notelist{max-width:min(392px,92vw);margin:9px auto 0;display:flex;flex-direction:column;gap:6px}
.noteitem{
  font-size:12.5px;color:var(--ink2);background:var(--chip);border-radius:11px;padding:8px 12px;
  display:flex;gap:8px;align-items:flex-start;line-height:1.5;
}
.noteitem em{font-style:normal;color:var(--ink4);font-size:11.5px;white-space:nowrap}

/* ============================== 筛选面板（硬性条件） ============================== */
.iconbtn{
  width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-btn);flex:none;transition:transform .14s;position:relative;
}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round}
.badge{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:650;display:grid;place-items:center;
}
.fsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:11px}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.fico{width:30px;height:30px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none;color:var(--ink2)}
.fico svg{width:16px;height:16px}
.fico .sparkle{width:14px;height:14px;color:var(--ink)}
.ftitle{font-size:15px;font-weight:600;letter-spacing:-.01em}
.fsub{font-size:12px;color:var(--ink4);margin-left:auto;white-space:nowrap}
.fnote{font-size:11.5px;color:var(--ink4);line-height:1.6;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2)}
.fchip{
  padding:8px 14px;border-radius:9px;background:var(--tint);border:1px solid transparent;
  color:var(--ink2);font-size:14px;transition:background .16s,color .16s,transform .12s;
}
.fchip:active{transform:scale(.95)}
.fchip i{font-style:normal;opacity:.45;font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.fchip.z{opacity:.32;pointer-events:none}
.lgrow{display:flex;gap:12px;align-items:center;padding:6px 0}
.lgk{flex:none;width:32px;font-size:12.5px;color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 双滑块 */
.rng{position:relative;height:38px;margin-top:6px}
.rng .track{position:absolute;top:17px;left:9px;right:9px;height:4px;border-radius:4px;background:var(--line)}
.rng .fillbar{position:absolute;top:17px;height:4px;border-radius:4px;background:var(--ink)}
.rng input{
  position:absolute;top:0;left:0;width:100%;height:38px;margin:0;background:none;pointer-events:none;
  -webkit-appearance:none;appearance:none;
}
.rng input::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-btn);cursor:grab;
}
.rng input::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
.rng input::-moz-range-thumb{
  pointer-events:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--sh-btn);cursor:grab;
}
.rngval{display:flex;justify-content:space-between;font-size:17px;font-weight:640;letter-spacing:-.01em}
.rngval span{font-size:13px;font-weight:400;color:var(--ink3)}

.memrow{display:grid;grid-template-columns:16px 26px auto 1fr auto;gap:7px 9px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.memgrip{color:var(--ink4);cursor:grab;font-size:12px}
.memrow.dragover{box-shadow:inset 0 2px 0 var(--ink)}
.memrow .memdim{grid-column:3/4}
.memrow:first-child{border-top:0}
.memrow .memdim{grid-column:2/3}
.memsign{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);flex:none;font-size:13px;line-height:1}
.memsign[data-s="1"]{background:var(--pick);border-color:var(--pick);color:#fff}
.memsign[data-s="-1"]{background:var(--pass);border-color:var(--pass);color:#fff}
.memtext{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:2px 0}
.memtext:focus{outline:none;border-bottom:1px solid var(--ink3)}
.memdim{border:1px solid var(--line);background:var(--panel);color:var(--ink3);border-radius:7px;
  font:inherit;font-size:11.5px;padding:4px 6px;justify-self:start;max-width:100%}
.memdel{width:24px;height:24px;border-radius:7px;color:var(--ink4);flex:none;font-size:15px;line-height:1}
.memdel:hover{color:var(--pass);background:var(--tint)}
.seedchip{font-size:12.5px;line-height:1.5;padding:6px 10px;border-radius:8px;background:var(--tint);color:var(--ink2);
  margin:5px 5px 0 0;display:inline-block;text-align:left;max-width:100%}
.seedchip:hover{background:var(--tint2);color:var(--ink)}
.fbar{
  position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);
  padding:20px 0 8px;margin-top:6px;display:flex;gap:9px;align-items:center;
}
.fcount{flex:1;font-size:13px;color:var(--ink2);line-height:1.45}
.fcount b{font-size:19px;font-weight:640;color:var(--ink);letter-spacing:-.01em}
.fcount.thin b{color:var(--pass)}
</style>
</head>
<body>

<!-- ============================== LANDING ============================== -->
<div id="landing" class="screen on">
  <div class="lwrap">
    <h1 class="h1">滑简历，<em>出画像</em>。</h1>
    <div class="fan" id="fan"><i class="tex-v"></i><i class="tex-g"></i><i class="tex-k"></i><i class="tex-d"></i><i class="tex-s"></i><button class="fmk fmk-x" id="fanx" aria-label="演示：左滑不要"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="fmk fmk-v" id="fanv" aria-label="演示：右滑要"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 10 18 19.5 6.5"/></svg></button></div>

    <div class="field">
      <div class="flabel">岗位</div>
      <input class="cvin" id="rolesearch" style="min-height:0;padding:12px 15px;font-family:var(--font);font-size:14px"
        placeholder="搜索在招岗位：评测 / 推荐算法 / 前端…">
      <div class="chips" id="pickedjobs" style="margin-top:8px"></div>
      <div id="joblist"></div>
      <div id="park" style="display:none"></div>
    </div>

    <div id="parsed">
      <div class="field" id="selfield" style="display:none">

        <div id="selrows" style="display:none">
          <div id="selq" style="font-size:13.5px;margin:10px 0 4px;color:var(--ink)"></div>
          <div class="selrow" data-k="role"><span class="selk">职能</span><div class="chips" id="f-role"></div></div>
          <div class="selrow" data-k="sub"><span class="selk">方向</span><div class="chips" id="f-sub"></div></div>
          <div class="selrow" data-k="stage"><span class="selk">阶段</span><div class="chips" id="f-year"></div></div>
          <div class="selrow" data-k="tk"><span class="selk">赛道</span><div class="chips" id="f-track"></div></div>

function makeCard(id, d, tk, F, role, stage){
  const r=rng(id+7919), T=TRACKS[tk];
  const kind=ROLEKIND(role||'产品经理'), style=P(r,STYLES), soc=stage==='社招';
  const coName = d.co==='rival' ? P(r,T.rival) : P(r,CO[d.co]);
  const coName2 = d.co==='big' ? P(r,CO.uni) : P(r,CO.big);
  const tkOf = d.track==='same' ? tk : d.track==='near' ? NEAR[tk] : P(r,Object.keys(TRACKS).filter(k=>k!==tk&&k!==NEAR[tk]));
  const T2=TRACKS[tkOf];
  const mod=P(r,T2.mod), mod2=P(r,TRACKS[P(r,Object.keys(TRACKS))].mod);
  const met=P(r,T2.met), n1=I(r,8,42), n2=I(r,12,60);
  const metD=P(r,T2.down||['成本']), nd=I(r,14,45);   // 越低越好的指标不能说「提升到」
  const school=P(r,SCHOOL[d.school]), major=P(r,MAJOR[d.major]);
  const name=P(r,SUR)+P(r,GIV);

  let age=soc?I(r,24,33):I(r,21,26), onsite=P(r,[3,4,5,5]);
  let dur1=soc?I(r,1,6):I(r,3,10), dur2=0;
  const AIB = tkOf==='ai' && {
    yes:[`独立从 0 到 1 做了「${mod}」：自己定指标、写 Prompt、拉算法和工程，两周一个版本跑到上线`,
         `团队没有专职 PM，我接了「${mod}」—— 先攒了 ${I(r,120,600)} 条的评测集，再拿它推动模型侧调优`,
         `牵头「${mod}」第一版，从场景定义、bad case 归因一路跟到灰度放量`],
    no: [`负责「${mod}」的日常迭代，维护 Prompt 版本和 ${I(r,40,200)} 条回归用例`,
         `在成熟的「${mod}」团队里承接需求拆解，跟进每周的 bad case 复盘`,
         `维护「${mod}」已有能力，配合算法同学定标注规范和验收标准`],
    quant:[`上线后 ${met} 从 ${n1}% 提升到 ${n1+I(r,4,15)}%，${metD}同时降了 ${I(r,12,40)}%`,
           `把 ${met} 从 ${n1}% 做到 ${n1+I(r,5,18)}%，这条指标后来进了团队季度 OKR`,
           `${metD}从 ${nd}% 压到 ${Math.max(3,nd-I(r,8,20))}%，复盘时被拉出来讲过一次`],
    work:[`沉淀了一份 ${I(r,150,800)} 条的评测集和一套 bad case 分类法，现在是团队验收的默认标准`,
          `产出「${mod}」的竞品拆解（横向比了 Kimi / 豆包 / ChatGPT 的处理方式）加一版可交互原型`],
    desc:[`参与需求评审、标注验收、跟进排期等日常工作`,
          `配合完成 Prompt 文档整理与跨团队沟通`]
  };
  const RB = kind!=='pm' && ROLEB[kind];
  const sys = RB ? P(r,SYS[kind]) : null;
  let b1 = RB ? P(r, RB[d.z01](sys)) : AIB ? P(r, AIB[d.z01]) : d.z01==='yes'
    ? P(r,[`独立从 0 到 1 做了「${mod}」，自己写 PRD、拉研发、跟到灰度上线`,
           `团队没有专职 PM，我接了「${mod}」，从用户访谈一路做到上线复盘`,
           `牵头「${mod}」第一版，两个月从想法到可用`])
    : P(r,[`负责「${mod}」的日常迭代，跟进 3 个版本的需求评审与验收`,
           `维护「${mod}」已有功能，配合运营完成 5 次活动配置`,
           `在成熟的「${mod}」团队里承接需求拆解与数据看板维护`]);
  let b2 = RB ? P(r, d.proof==='quant'?RB.quant(sys,I(r,6,40)):RB[d.proof](sys))
           : AIB ? P(r, AIB[d.proof]) : d.proof==='quant'
    ? P(r,[`上线后 ${met} 从 ${n1}% 提升到 ${n1+I(r,3,14)}%，被写进季度复盘`,
           `${metD}从 ${nd}% 降到 ${Math.max(3,nd-I(r,7,18))}%，被写进季度复盘`])
    : d.proof==='work'
    ? P(r,[`沉淀了一份「${mod}」竞品拆解 + 可交互原型，团队后续复用`,`产出 20 页的用户访谈纪要和一版完整原型，附在申请材料里`])
    : P(r,[`参与需求评审、用户调研、跟进排期等日常工作`,`配合完成文档整理与跨部门沟通`]);
  // 社招：不是「实习了 N 个月」，是带线、带人、背指标
  if(soc){
    const X = RB ? sys : mod;
    b1 = d.z01==='yes'
      ? (dur1>=3
         ? P(r,[`从 0 拉起「${X}」这条线，从一个人做到 ${I(r,3,9)} 人小组`,
                `主导「${X}」从立项到规模化，全程负责`])
         : P(r,[`独立从 0 搭起「${X}」的第一版并跟到上线`,
                `「${X}」立项时我是唯一${kind==='pm'?'产品':'研发'}，从设计做到交付`]))
      : P(r,[`接手成熟的「${X}」，负责季度规划与迭代排期`,
             `在「${X}」团队里负责其中一条功能线，向总监汇报`]);
    b2 = d.proof==='quant'
      ? (kind==='dev'
         ? P(r,[`重构后支撑日均 ${I(r,1,9)} 亿请求，P99 从 ${I(r,120,400)}ms 降到 ${I(r,30,90)}ms`,
                `把服务可用性做到 99.9${I(r,5,9)}%，年故障时长缩到 ${I(r,1,4)} 小时`])
         : kind==='qa'
         ? P(r,[`发布频率从双周提到日发，线上事故同比降 ${I(r,30,70)}%`])
         : P(r, dur1>=2
             ? [`任内 ${met} 从 ${n1}% 做到 ${n1+I(r,6,22)}%，对应年营收增量约 ${I(r,300,5000)} 万`,
                `${metD}从 ${nd}% 压到 ${Math.max(3,nd-I(r,8,20))}%，写进部门年度复盘`]
             : [`任内 ${met} 从 ${n1}% 做到 ${n1+I(r,5,14)}%`,
                `${metD}从 ${nd}% 压到 ${Math.max(3,nd-I(r,6,14))}%`]))
      : d.proof==='work'
      ? P(r,[`沉淀的「${X}」方法论和评审体系成了部门模板`,
             `输出的技术方案被相邻两个团队复用`])
      : P(r,[`负责「${X}」的日常需求管理与跨部门协调`]);
  }
  const b3 = soc
    ? (dur1>=3
       ? P(r,[`带过 ${I(r,2,6)} 人${kind==='pm'?'产品小组':'小团队'}，负责晋升评审和招聘`,
              `横向拉通 ${I(r,2,5)} 个团队交付季度目标`,
              `经历过一次组织调整，把线稳住没掉人`])
       : P(r,[`和 ${I(r,2,6)} 名${kind==='pm'?'研发':'同事'}日常协作，独立扛一条线`,
              `参与季度规划，负责自己这条线的排期`]))
    : RB ? P(r, kind==='dev'
      ? [`日常和 ${I(r,2,5)} 名后端 + ${I(r,1,3)} 名前端协作，走 code review 合码`,
         `参与每周的技术方案评审，写过 ${I(r,2,8)} 份设计文档`,
         `远程 / 到岗混合，每周到岗 ${I(r,3,5)} 天`]
      : [`日常和 ${I(r,3,8)} 名开发对接，负责发版前的回归卡点`,
         `参与每两周的缺陷复盘，跟进 ${I(r,10,60)} 个线上问题闭环`,
         `远程 / 到岗混合，每周到岗 ${I(r,3,5)} 天`])
    : P(r, tkOf==='ai'
    ? [`日常和 ${I(r,2,5)} 名算法 + ${I(r,2,4)} 名工程协作，每周过一次 case review`,
       `远程 / 到岗混合，每周到岗 ${I(r,3,5)} 天`,
       `汇报给一位从 ${P(r,['推荐','搜索','NLP','增长'])} 转过来的产品负责人`]
    : [`日常和 ${I(r,2,6)} 名研发 + ${I(r,1,3)} 名设计协作，周会上过需求`,
                  `远程 / 到岗混合，每周到岗 ${I(r,3,5)} 天`,
                  `汇报给一位 ${I(r,3,8)} 年经验的产品负责人`]);

  const second = r()>0.32 ? {
    co:coName2,
    role:'',
    dur:'',
    lines:[P(r,[`跟进「${mod2}」的需求文档与验收`,`做过一轮竞品调研与市场规模测算`,`负责后台配置与日常答疑`])]
  } : null;

  const skill=[];
  if(kind==='pm'){
    if(d.major==='cs') skill.push('会写代码','读得懂接口文档');
    if(d.major==='eng') skill.push('会写 SQL','Python 数据处理');
    if(d.major==='biz') skill.push('用户访谈','商业分析');
  } else {
    if(d.major==='cs') skill.push('数据结构扎实','读得懂源码');
    if(d.major==='eng') skill.push('会写 SQL','Linux 常用命令');
    if(d.major==='biz') skill.push('自学转码','刷过 LeetCode');
  }
  if(d.z01==='yes') skill.push(kind==='pm'?'0→1':'从 0 搭过服务');
  if(d.proof==='quant') skill.push('数据驱动');
  if(d.proof==='work') skill.push('原型/Figma');
  if(kind==='dev') skill.push(...P(r,[['MySQL','Redis'],['Kafka','K8s'],['Docker','gRPC'],['分布式','微服务']]));
  if(kind==='qa')  skill.push(...P(r,[['pytest','接口自动化'],['JMeter','压测'],['Selenium','CI/CD'],['Jenkins','缺陷分析']]));
  if(tkOf==='ai' && kind==='pm'){
    skill.push(P(r,['Prompt 工程','评测集设计','bad case 归因']));
    if(d.proof!=='desc') skill.push(P(r,['RAG','Agent 编排','标注规范','会看 trace log']));
    if(d.major==='cs') skill.push(P(r,['读得懂论文','跑过微调','LangGraph']));
  }
  if(d.co==='rival') skill.push(T.name+'背景');
  if(d.co==='start') skill.push('抗压', kind==='pm'?'什么都干':'全栈都碰过');
  if(d.co==='big') skill.push('流程规范');
  skill.push(P(r, kind==='pm' ? ['英语可工作','出海经验','B端','C端','增长','会做PPT但不喜欢']
    : kind==='dev' ? ['英语可工作','读英文文档','有开源 PR','写过技术博客','刷题 500+']
    : ['英语可工作','写过测试用例模板','懂一点性能调优','会看火焰图']));

  const self = (tkOf==='ai' && kind==='pm')
    ? (d.z01==='yes'
       ? P(r,[`比起写 PRD，我更愿意先自己去跑一百条 case 看模型到底错在哪。`,
              `喜欢做还没被定义清楚的事，AI 产品最好玩的就是标准是自己立的。`])
       : P(r,[`习惯先把评测标准和数据看清楚再动手改 Prompt。`,
              `做事比较稳，喜欢把 bad case 一条条归类到能复现为止。`]))
    : kind==='dev'
      ? (d.z01==='yes'
         ? P(r,[`喜欢从头把一个服务立起来，比接手别人的代码有意思。`,`遇到问题习惯先看源码再问人。`])
         : P(r,[`做事比较稳，改动前会先看清上下游依赖。`,`喜欢把已有系统的边界情况一个个啃干净。`]))
      : kind==='qa'
      ? (d.z01==='yes'
         ? P(r,[`见不得重复劳动，能自动化的绝不手工点。`,`喜欢把「测不出来」变成「测得出来」。`])
         : P(r,[`做事细，用例宁可写重也不肯漏。`,`喜欢把缺陷归因到能稳定复现为止。`]))
    : (d.z01==='yes'
       ? P(r,[`喜欢自己动手把东西做出来，不太能忍受只写文档不落地。`,`最爽的是看到自己拍板的东西真的有人用。`])
       : P(r,[`做事比较稳，习惯把流程和文档理清楚再动。`,`喜欢在成熟体系里把一件事做扎实。`]));

  let en  = P(r,['工作','工作','日常','日常','日常','弱']);
  let jp  = r()>0.87 ? P(r,['N1','N2']) : null;
  let fr  = r()>0.95 ? '熟练' : null;
  const code=(()=>{
    const pool=['Python','SQL','Java','Go','JS/TS','C++'];
    const n = d.major==='cs'? I(r,2,4) : d.major==='eng'? I(r,1,3) : (r()>0.55?1:0);
    const o=[]; for(let i=0;i<n;i++){const x=P(r,pool); if(!o.includes(x)) o.push(x);}
    return o;
  })();

  // 硬性条件不是拿来过滤的，是拿来「定义候选人宇宙」的 —— 按条件构造，
  // 这样偏好维度的正交性在任何筛选下都保持完整，推断照样有效
  if(F){
    const lo=Math.max(21,F.age[0]), hi=Math.min(26,F.age[1]);
    age = hi>=lo ? I(r,lo,hi) : Math.max(21,Math.min(26,F.age[0]));
    if(F.onsite.length) onsite=P(r,F.onsite);
    for(const x of F.code) if(!code.includes(x)) code.push(x);
    if(F.lang.length){
      const want=P(r,F.lang);                       // 多选是「或」，随机满足其中一条
      if(want==='en_work') en='工作';
      else if(want==='en_daily'){ if(en==='弱') en='日常'; }
      else jp = jp || P(r,['N1','N2']);
    }
    let tot=dur1+dur2;
    if(tot<F.months[0]||tot>F.months[1]){
      tot=I(r,Math.max(0,F.months[0]),Math.min(14,F.months[1]));
      dur2 = second ? Math.min(dur2,Math.max(0,tot-1)) : 0;
      dur1 = Math.max(tot-dur2,0);
    }
  }
  if(second){
    dur2 = soc?I(r,0,2):I(r,2,4);
    second.dur = soc ? `${Math.max(1,dur2)} 年` : `${dur2} 个月`;
    second.role = soc
      ? (kind==='dev'?'后端工程师':kind==='qa'?'测试工程师':'产品经理')
      : P(r,['产品实习生','产品运营实习生','数据分析实习生','战略投资实习生','用户研究实习生']);
  }

  // 真实校招简历会有的东西：求职意向、GPA/排名、主修课、证书
  const gpa=(2.9+r()*1.2).toFixed(2), rank=I(r,3,45);
  const courses = d.major==='cs' ? P(r,[['数据结构','机器学习','数据库系统'],['算法设计','自然语言处理','软件工程']])
    : d.major==='eng' ? P(r,[['概率论与数理统计','运筹学','信号处理'],['数理统计','最优化方法','控制理论']])
    : P(r,[['消费者行为学','市场调研','统计学'],['传播学研究方法','社会统计','用户心理']]);
  const certs=[];
  if(en==='工作') certs.push(P(r,[`雅思 ${(6.5+Math.floor(r()*2)/2).toFixed(1)}`,`托福 ${I(r,95,110)}`,'CET-6 ' + I(r,560,650)]));
  else if(en==='日常') certs.push('CET-'+P(r,['4 '+I(r,500,570),'6 '+I(r,430,500)]));
  if(jp) certs.push('日语 '+jp);
  if(fr) certs.push(P(r,['法语 DELF B2','法语 TCF C1']));
  if(r()>0.6) certs.push(P(r,['NPDP 产品经理认证','Google 数据分析证书','PMP（在考）']));

  return {
    id, d, name, school, major, tk:tkOf,
    grad: soc?`${dur1+dur2} 年经验`:'2027.06 毕业', gpa, rank, courses, certs,
    intent:`${kind==='dev'?P(r,['后端开发','研发','算法']):kind==='qa'?P(r,['测试开发','质量工程']):P(r,['产品经理','AI 产品经理','产品经理（策略方向）'])}${soc?'':stage==='校招'?'（校招）':'实习'} · ${P(r,['北京','上海','杭州','深圳'])}${stage==='实习'?` · 每周 ${onsite} 天`:''}`,
    age, en, jp, fr, code, months:dur1+dur2, onsite,
    av:id%8, ini:name.slice(0,1),
    style,
    exp1:{co:coName,
      role: soc
          ? (kind==='dev' ? (dur1>=4?'资深':dur1>=2?'高级':'')+'后端工程师'
             : kind==='qa' ? (dur1>=4?'资深':'')+'测试开发工程师'
             : (dur1>=4?'资深':dur1>=2?'高级':'')+'产品经理')
          : kind==='dev' ? P(r,['后端开发实习生','研发实习生','算法工程实习生'])
          : kind==='qa'  ? P(r,['测试开发实习生','质量工程实习生','测试实习生'])
          : P(r,['产品经理实习生','产品实习生','增长产品实习生']),
      dur:soc?`${dur1} 年`:`${dur1} 个月`,
      lines: style==='terse' ? [b1,b2] : style==='rich' ? [b1,b2,b3,
        P(r, (d.z01==='no'&&d.proof==='desc')
          ? [`每周整理一份进度同步邮件`,`维护团队的需求排期表和会议纪要`,`跟着导师做了几轮竞品体验`]
          : kind==='pm'
          ? [`同期还跟了「${mod2}」的需求，两条线并行`,`主动做了一轮用户回访（${I(r,8,25)} 位），整理成纪要给到团队`]
          : kind==='dev'
          ? [`顺手把「${sys}」的单测覆盖从 ${I(r,30,55)}% 补到 ${I(r,70,88)}%`,`值过 ${I(r,4,12)} 次线上 oncall，处理过 ${I(r,2,9)} 次 P2 故障`]
          : [`同时维护 ${I(r,80,400)} 条历史用例，每次发版前跑一轮`,`推动开发把 ${I(r,5,20)} 个高频缺陷做了根因治理`])
      ] : [b1,b2,b3]},
    exp2:second,
    proj:{title:P(r,[`个人项目：${mod2}`,`课程项目：${mod2}`,`校园创业：${mod2}`]), line:d.proof==='desc'?'参与其中的需求梳理部分':`独立完成，${d.proof==='quant'?`累计 ${I(r,200,9000)} 名用户使用`:'有完整原型和演示视频'}`},
    skill:[...new Set(skill)], self
  };
}

/* ---------- 造整副牌：5 个维度全组合 × 2 变体 = 432 张 ---------- */
function buildDeck(tk, F, role, stage){
  const out=[]; let i=0;
  const sk=(F&&F.school.length)?F.school:Object.keys(DIMS.school.L);
  for(const co of ['big','uni','start','rival'])
   for(const z01 of ['yes','no'])
    for(const major of ['cs','eng','biz'])
     for(const track of ['same','near','cross'])
      for(const proof of ['quant','work','desc'])
       for(let v=0;v<2;v++){
         // 学校随机分配（不进正交网格）—— 于是它成了对照变量：
         // 如果它照样跑出强信号，说明面试官在无意识地按学校筛人
         const school=sk[Math.floor(rng(i*977+13)()*sk.length)];
         out.push(makeCard(i++,{co,z01,major,track,proof,school},tk,F,role,stage));
       }
  // Fisher-Yates，确定性
  const r=rng(1234567);
  for(let k=out.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[out[k],out[j]]=[out[j],out[k]];}
  return out;
}

const S={ role:'产品', year:'实习', tk:'ai', deck:[], i:0,
          stack:[], decisions:[], annos:{}, sheetCard:null, pool:[] };
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage');
const V={ no:-1, yes:1, star:2 };

/* ==================================================================
   3. 卡片渲染
   ================================================================== */
function pinHTML(dim,key){

}
function blk(dim,key,kicker,val,detail,extraCls){

    <div class="bk">${kicker}</div><div class="bv">${val}</div>${detail?`<div class="bd">${detail}</div>`:''}
    ${pinHTML(dim,key)}</div>`;
}
function cardHTML(c){

    </div>
    ${blk('school','school','教育背景',`<span class="sens">${c.school}</span>${c.major?' · '+c.major:''}`, SOC()?'':`GPA ${c.gpa} · 专业前 ${c.rank}%`)}
    ${blk('co','co',SOC()?'现任':'主要实习',`${c.exp1.co}${c.exp1.role?' · '+c.exp1.role:''}`,`${c.exp1.dur} · ${TRACKS[c.tk].name}（${tkl}）`)}
    ${blk('z01','z01','做的事','',`<ul style="margin:0;padding:0"><li>${c.exp1.lines[0]}</li></ul>`)}
    ${c.exp1.lines[1]?blk('proof','proof','产出','',`<ul style="margin:0;padding:0"><li>${c.exp1.lines[1]}</li></ul>`):''}
    ${c.real&&c.exp1.lines[2]?blk('track','more','还写了','',`<ul style="margin:0;padding:0"><li>${c.exp1.lines[2]}</li></ul>`):''}
    <div class="tags">${c.skill.slice(0, innerWidth<480?4:6).map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    <div class="hint">点开看全简历</div>

  <div class="stamp s-star"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.5 6.3 5.2 11 11.5 11.5v1C17.2 13 12.5 17.7 12 24h-1C10.5 17.7 5.8 13 -.5 12.5v-1C5.8 11 10.5 6.3 11 0h1z"/></svg> 直接约面</div>`;

function makeEl(c){
  const el=document.createElement('div');
  el.className='card'; el.dataset.cid=c.id; el.innerHTML=cardHTML(c);
  applyAnno(el,c);
  return el;
}
function applyAnno(el,c){
  const a=S.annos[c.id]||{};
  el.querySelectorAll('.blk,.sec').forEach(b=>{
    const k=b.dataset.key, v=a[k];
    b.classList.toggle('plus', v?.sign===1); b.classList.toggle('minus', v?.sign===-1);
    b.classList.toggle('has', !!v);
  });
}

/* ==================================================================
   4. 牌堆布局 —— 只保留 3 张在 DOM 里
   ================================================================== */
const REST=k=>`translate3d(0,0,0) scale(${k?0.985:1})`;
function layout(anim){
  S.stack.forEach((s,k)=>{
    s.el.style.zIndex=20-k;
    if(anim) s.el.classList.add('anim');
    s.el.style.transform=REST(k);
    s.el.style.opacity = k? '0' : '1';
    s.el.classList.toggle('behind',k>0);
  });
}
/* 每个（维度,取值）已经被判断过几次 */
function exposure(){
  const e={};
  for(const dim in DIMS){ e[dim]={}; for(const lv in DIMS[dim].L) e[dim][lv]=0; }
  for(const d of S.decisions) for(const dim in DIMS) e[dim][d.card.d[dim]]++;
  return e;
}
/* 主动选卡：前 5 张求最大差异做粗定位，之后补最缺的取值 + 追已经露头的信号 */
function nextCard(){
  if(!S.pool.length) return null;
  const dealt=[...S.decisions.map(d=>d.card),...S.stack.map(s=>s.card)];
  const K=Object.keys(DIMS);
  if(S.decisions.length<5){
    let bi=0,bs=-1;
    for(let i=0;i<Math.min(60,S.pool.length);i++){
      const c=S.pool[i];
      let s=dealt.length?1e9:0;
      for(const o of dealt){ let h=0; for(const k of K) if(c.d[k]!==o.d[k]) h++; s=Math.min(s,h); }
      if(s>bs){bs=s;bi=i}
    }
    return S.pool.splice(bi,1)[0];
  }
  // 每三张送一张模型最不看好的「挑战卡」—— 否则后期全发好卡，
  // 负例断供，模型退化成「全都要」（真人库上实测会崩，合成正交流程掩盖了它）
  if(S.decisions.length>=6 && S.decisions.length%3===2 && FIT){
    let bi=-1,bp=2;
    for(let i=0;i<Math.min(80,S.pool.length);i++){
      const pp=predictP(S.pool[i]); if(pp!=null&&pp<bp){bp=pp;bi=i}
    }
    if(bi>=0&&bp<0.5){ const c=S.pool.splice(bi,1)[0]; c._ch=true; return c; }
  }
  const e=exposure(), A=analyze(false,150).out;
  let sd=(S.decisions.length*2654435761)>>>0;
  const rnd=()=>{sd^=sd<<13;sd>>>=0;sd^=sd>>>17;sd^=sd<<5;sd>>>=0;return sd/4294967296};
  let bi=0,bs=-1;
  for(let i=0;i<Math.min(80,S.pool.length);i++){
    const c=S.pool[i]; let sc=0;
    for(const k of K){
      const inHand=S.stack.reduce((n,s)=>n+(s.card.d[k]===c.d[k]?1:0),0);
      sc += (0.35+A[k].spread)/(1+e[k][c.d[k]]+inHand);   // 缺样本的取值优先，有信号的维度加权
    }
    sc *= 0.8+0.4*rnd();   // 抖动：纯 argmax 会在小样本里制造维度间伪相关，反过来骗过回归
    if(sc>bs){bs=sc;bi=i}
  }
  return S.pool.splice(bi,1)[0];
}
function fill(){
  while(S.stack.length<3){
    const c=nextCard(); if(!c) break;
    const el=makeEl(c);
    el.style.transform=REST(S.stack.length);
    el.style.opacity = S.stack.length ? '0' : '1';
    el.classList.toggle('behind', S.stack.length>0);
    el.style.zIndex=20-S.stack.length;
    stage.appendChild(el);
    S.stack.push({el,card:c});
  }
  $('#empty').style.display = S.stack.length? 'none':'grid';
  if(!S.stack.length){
    const more=widenFresh().length>S.pool.length;
    $('#emptyhint').textContent = portraitReady()? '' :
      (more? '画像还没出。' : '画像还没出，库里没有更多了。');
    $('#emptywiden').style.display = more? '' : 'none';
  }
  if(!S.stack.length && S.decisions.length>=10 && !S.autoDone && portraitReady()){
    S.autoDone=true;                                  // 滑完自动出画像（没就绪就停在空状态让用户选）
    setTimeout(()=>{
      if(S.stack.length||S.pool.length){ S.autoDone=false; return; }   // 期间点了扩大范围就不跳
      render(); show('result'); window.scrollTo(0,0);
    },500);
  }
}

/* ==================================================================
   5. 拖拽引擎 —— rAF 合帧，拖动期间零重排、只写 transform / opacity
   ================================================================== */
let drag=null, raf=0, pending=null;
const TH=()=>stage.clientWidth*0.26;
const THU=()=>stage.clientHeight*0.16;

stage.addEventListener('pointerdown',e=>{
  if(!S.stack.length) return;
  const top=S.stack[0];
  if(!top.el.contains(e.target)) return;
  if(e.target.closest('.pinbtn')) return;
  top.el.classList.remove('anim','fly');
  try{top.el.setPointerCapture(e.pointerId)}catch(_){}
  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,lt:performance.now(),
        t0:performance.now(),vx:0,vy:0,moved:0,dx:0,dy:0};
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const now=performance.now(), dt=now-drag.lt;
  if(dt>0){ drag.vx=(e.clientX-drag.lx)/dt; drag.lx=e.clientX; drag.lt=now; }
  drag.dx=e.clientX-drag.x0; drag.dy=e.clientY-drag.y0;
  drag.moved=Math.max(drag.moved,Math.hypot(drag.dx,drag.dy));
  pending=drag;
  if(!raf) raf=requestAnimationFrame(paint);
});
function paint(){
  raf=0; if(!pending||!S.stack.length) return;
  const {dx,dy}=pending, top=S.stack[0];
  const rot=Math.max(-16,Math.min(16,dx*0.05));
  top.el.style.transform=`translate3d(${dx}px,${dy}px,0) rotate(${rot}deg)`;
  const px=Math.min(1,Math.abs(dx)/TH()), py=Math.min(1,Math.max(0,-dy)/THU());
  const up = -dy>Math.abs(dx)*1.25;
  top.el.querySelector('.s-yes').style.opacity = up?0:(dx>0?px:0);
  top.el.querySelector('.s-no').style.opacity  = up?0:(dx<0?px:0);
  top.el.querySelector('.s-star').style.opacity = up?py:0;

}
stage.addEventListener('touchmove',e=>{ if(drag) e.preventDefault(); },{passive:false});
stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
function end(e){
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag; drag=null; pending=null;
  if(raf){cancelAnimationFrame(raf);raf=0}
  if(!S.stack.length) return;
  const top=S.stack[0], dur=performance.now()-d.t0;
  // 轻点 = 看全简历
  if(d.moved<7 && dur<420){ snap(top.el); openSheet(top.card); return; }
  const fling=Math.abs(d.vx)>0.62;
  const up = -d.dy>Math.abs(d.dx)*1.25 && -d.dy>THU();
  if(up) return decide('star');
  if(Math.abs(d.dx)>TH() || fling) return decide(d.dx>0?'yes':'no');
  snap(top.el);
}
function snap(el){
  el.classList.add('anim'); el.style.transform=REST(0);
  el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
}

/* ==================================================================
   6. 判定 / 撤销
   ================================================================== */
function decide(v){
  if(!S.stack.length) return;
  const {el,card}=S.stack.shift();
  const dw=(performance.now()-(S.topT||performance.now()))/1000;
  S.decisions.push({card, v, anno:S.annos[card.id]||null, pred:predictP(card), dw, ch:card._ch||false});
  card._ch=false;
  S.topT=performance.now();
  refit();
  S.i++;
  const w=stage.clientWidth, h=stage.clientHeight;
  el.classList.remove('anim'); el.classList.add('fly');
  el.querySelector('.s-yes').style.opacity = v==='yes'?1:0;
  el.querySelector('.s-no').style.opacity  = v==='no'?1:0;
  el.querySelector('.s-star').style.opacity= v==='star'?1:0;
  el.style.transform = v==='star' ? `translate3d(0,${-h*1.15}px,0) rotate(-3deg)`
    : `translate3d(${(v==='yes'?1:-1)*w*1.35}px,${h*0.09}px,0) rotate(${(v==='yes'?1:-1)*24}deg)`;
  el.style.opacity='0';
  setTimeout(()=>el.remove(),430);
  layout(true); fill(); tick();
  if(v==='star'){                                   // 趁热记亮点，可跳过，7 秒自动收
    S.lastStar=card.name;
    const sn=$('#starnote'); sn.style.display='flex'; $('#starnote-in').value='';
    clearTimeout(S.snT); S.snT=setTimeout(()=>sn.style.display='none',7000);
  }
  if(navigator.vibrate) navigator.vibrate(9);
}
function undo(){
  if(!S.decisions.length) return;
  const last=S.decisions.pop(); S.i--; refit();
  while(S.stack.length>2){ const x=S.stack.pop(); x.el.remove(); S.pool.unshift(x.card); }
  const el=makeEl(last.card);
  const w=stage.clientWidth,h=stage.clientHeight;
  el.style.transform = last.v==='star' ? `translate3d(0,${-h*1.15}px,0)`
    : `translate3d(${(last.v==='yes'?1:-1)*w*1.35}px,0,0)`;
  el.style.zIndex=21; stage.appendChild(el);
  S.stack.unshift({el,card:last.card});
  el.getBoundingClientRect();
  layout(true); tick();
}
function balanced(){
  const n=S.decisions.length, P0=S.decisions.filter(d=>d.v!=='no').length;
  return Math.min(P0,n-P0) > Math.max(2, n*0.12);
}
function portraitReady(){
  if(S.decisions.length<10) return false;
  // 全要/全否时命中率是常数分类器作弊 —— 没有对比就没有画像，一票否决
  if(!balanced()) return false;
  const A=analyze(false);
  S._mp=0;
  for(const d of Object.values(A.out)){
    S._mp=Math.max(S._mp,d.power);
    // 真人库非正交，效应量天然比合成正交标定（2.3+）稀释，阈值取 1.8
    if(d.power<1.8) continue;
    for(const l of Object.values(d.levels))
      if(l.exp>=4&&(l.adj>=.655||l.adj<=.345)) return true;
  }
  return false;
}
function tick(){
  const n=S.decisions.length;
  $('#counter').textContent=`${n} / ${S.deck.length}`;
  // 进度 = 离画像就绪还有多远，不是滑了多少张：
  // 数量 × 平衡双因子，且只有 portraitReady 才到 100
  const P0=S.decisions.filter(d=>d.v!=='no').length;
  const ready0 = portraitReady();
  $('#b-undo').disabled=!n;
  // 解锁 ⇔ 真的有画像文字可看（存在能写进画像的显著结论）
  const conv = n>=10 && balanced() && (hitRate(10)?.r||0)>=.75;
  const unlocked = ready0;
  $('#donebtn').disabled = !unlocked;
  $('#donebtn').classList.toggle('ready', unlocked);
  const nStar=S.decisions.filter(d=>d.v==='star').length+(S.importedStars||[]).length;
  const nYes=S.decisions.filter(d=>d.v==='yes').length+(S.importedYes||[]).length;
  $('#starcount').textContent = nStar+nYes ? (nStar?`✦${nStar}`:'')+(nStar&&nYes?' · ':'')+(nYes?`${nYes} 可聊`:'') : '0';
  learnUI();
}

/* ---- 「有没有在变好」：模型每张卡先猜、你再滑，猜中率就是答案 ---- */
function learnUI(){
  const now=hitRate(10);
  const st=$('#lstat'), fl=$('#lfill'), nm=$('#lnum'), why=$('#lwhy');
  // 条 = 画像就绪度，与出画像解锁严格同步；满条即可出
  const rn=S.decisions.length, rp=S.decisions.filter(d=>d.v!=='no').length;
  const ready=portraitReady();
  const balF2=rn?Math.min(1,Math.min(rp,rn-rp)/Math.max(3,rn*0.15)):0;
  const rd = ready ? 1 : Math.min(.96,
    Math.min(1,rn/10)*0.45 + balF2*0.2 + Math.min(1,(S._mp||0)/1.8)*0.35);
  st.textContent='画像';
  fl.style.width=(rd*100)+'%';
  fl.style.background = ready?'var(--pick)':'var(--ink)';
  nm.textContent = ready ? '✓ 可出' : Math.round(rd*100)+'%';
  if(!ready) S.ck=false;                       // ready 回落就重新武装，下次条满仍然必弹
  // 画像就绪 → 自动弹消息框，不等用户来点；与条上「✓ 可出」同一把尺，条满必弹
  if(!S.ck && ready){
    const A0=analyze(false);
    const top=Object.values(A0.out).sort((a,b)=>b.power-a.power)[0];
    const lv=Object.values(top.levels).sort((a,b)=>b.adj-a.adj);
    {
      S.ck=true;
      $('#toastmsg').innerHTML = top.power>=2.2
        ? `画像已就绪，最强信号<b>「${lv[0].label}」</b>。`
        : `画像已就绪。`;
      $('#toastacts').innerHTML=`
        <button class="gh" id="tview" style="padding:9px 14px;font-size:13.5px">查看画像</button>
        <button class="tbtn" id="tfilter">按画像筛库，继续滑</button>`;
      $('#toast').classList.add('on');
      const close=()=>$('#toast').classList.remove('on');
      $('#tview').onclick=()=>{ close(); render(); show('result'); window.scrollTo(0,0); };
      $('#tfilter').onclick=()=>{
        close();
        const before=S.pool.length;
        const scored=S.pool.map(c=>({c,p:predictP(c)??.5})).sort((a,b)=>b.p-a.p);
        let kept=scored.filter(x=>x.p>=.55).map(x=>x.c);
        if(kept.length<10) kept=scored.slice(0,10).map(x=>x.c);
        S.pool=kept;
        S.deck=[...S.decisions.map(d=>d.card),...S.stack.map(x=>x.card),...kept];   // 低分卡真正出堆；反悔用「扩大范围」
        if(REAL()) $('#jobtag').textContent=$('#jobtag').textContent.replace(/　\d+\/\d+$/,`　${S.deck.length}/${S.realTotal}`);
        S.flash=`筛掉 ${before-S.pool.length} 份低分的，剩 ${S.pool.length} 份接近画像的。`;
        setTimeout(()=>{ S.flash=null; learnUI(); },2600);
        tick();
      };
      setTimeout(()=>{ if($('#toast').classList.contains('on')) close(); }, 12000);
    }
  }
  if(S.flash){ why.innerHTML=S.flash; why.style.display='block'; return; }
  if(!now||now.n<5){ why.style.display='none'; return; }
  const r=now.r;

  // 全要死局：逼人左滑没用 —— 换问法。全要的人群里，强制排序是唯一还有信息量的问题
  if(S.decisions.length>=10 && !balanced() && S.pool.length>=2
     && (S.lastDuelAt==null || S.decisions.length-S.lastDuelAt>=3)){
    const P0=S.decisions.filter(d=>d.v!=='no').length;
    if(P0>S.decisions.length/2){                       // 全要才二选一；全否走原诊断
      const scored=S.pool.map(c=>({c,p:predictP(c)??.5})).sort((a,b)=>b.p-a.p).slice(0,6);
      const A2=scored[0].c, B2=scored[1].c;
      const cell=c=>`<b>${c.name}</b><div class="dm">${c.school}${c.major?' · '+c.major:''}<br>${c.exp1.co}<br>${(c.exp1.lines[0]||'').slice(0,42)}</div>`;
      $('#dA').innerHTML=cell(A2); $('#dB').innerHTML=cell(B2);
      $('#duel').classList.add('on');
      const pick=(win,lose)=>{
        S.pool=S.pool.filter(x=>x!==win&&x!==lose);
        S.decisions.push({card:win, v:'yes', pred:predictP(win), duel:true});
        S.decisions.push({card:lose, v:'no', pred:predictP(lose), duel:true});
        S.lastDuelAt=S.decisions.length;
        $('#duel').classList.remove('on');
        refit(); tick(); learnUI();
      };
      $('#dA').onclick=()=>pick(A2,B2);
      $('#dB').onclick=()=>pick(B2,A2);
      $('#dpA').onclick=()=>openSheet(A2);
      $('#dpB').onclick=()=>openSheet(B2);
      $('#dskip').onclick=()=>{ S.lastDuelAt=S.decisions.length; $('#duel').classList.remove('on'); };
      why.style.display='none';
      return;
    }
  }
  // 诊断只在有明确问题时出现，一次只说一件事：现状 → 一个动作
  const P0=S.decisions.filter(d=>d.v!=='no').length, N0=S.decisions.length-P0, n=S.decisions.length;
  if(n>=10 && Math.min(P0,N0)<=Math.max(2,n*0.12)){
    why.innerHTML=`${P0} 正 / ${N0} 负 —— 没有对比，出不了画像。${P0>N0?'左滑几个没那么想面的。':'右滑几个愿意聊 20 分钟的。'}`;
    why.style.display='block'; return;
  }
  if(!ready && n>=12 && r<.6){
    why.innerHTML=`猜不准 —— 还没看懂你在挑什么。点开简历，在打动你的那段上 ⊕ / ⊖。`;
    why.style.display='block'; return;
  }
  if(!ready && n>=16 && Object.values(analyze(false).out).every(d=>d.power<2.2)){   // 标定：真信号 2.3+
    why.innerHTML=`还没有稳定信号 —— 同类人给过相反判断。再滑一轮，或把某条<button id="w2f">设成硬性条件</button>。`;
    why.style.display='block';
    const w=$('#w2f'); if(w) w.onclick=()=>$('#filterbtn').click();
    return;
  }
  why.style.display='none';
}

/* ---- 随时记一笔：匹配到维度就立刻进模型，不是留言板 ---- */
function renderNotes(){
  $('#notelist').innerHTML=(S.notes||[]).slice(-3).reverse().map(n=>
    `<div class="noteitem"><span style="color:${n.sign<0?'var(--pass)':'var(--pick)'}">${n.sign<0?'−':'＋'}</span>
     <span style="flex:1">${n.text}</span>
     <em>${n.soft?'排序偏好':n.dim?DIMS[n.dim].L[n.lv]:'已记下'}</em></div>`).join('');
}
$('#starnote-skip').onclick=()=>{ $('#starnote').style.display='none'; clearTimeout(S.snT); };
$('#starnote-in').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const t=e.target.value.trim();
  if(t){ S.starNotes=S.starNotes||{}; S.starNotes[S.lastStar]=t; }
  $('#starnote').style.display='none'; clearTimeout(S.snT);
});
$('#tinput').addEventListener('input',e=>{ $('#tadd').disabled=!e.target.value.trim(); });
$('#tinput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim()) $('#tadd').click(); });
function addPreference(t, forcedSign, evidence){
  const {acts,note}=applyThought(t);
  const tag=note||tagNote(t);
  S.notes=S.notes||[];
  const entry={text:t, card:S.sheetCard?.name||S.stack[0]?.card.name||'', ...(tag||{sign:1})};
  if(forcedSign!=null) entry.sign=forcedSign;
  // 划选的负向且认不出维度 → 直接变排除词，真的影响检索
  const ev=(evidence||t);
  if(forcedSign===-1 && !entry.dim && ev.length<=16){
    S.F.kws=S.F.kws||[]; S.F.kws.push({t:ev, neg:true});
    acts.push(`排除词：「${ev}」`);
  }
  S.notes.push(entry);
  const before=S.pool.length+S.stack.length;
  reflowPool();
  const after=S.pool.length+S.stack.length;
  if(!acts.length && after<before) acts.push(`已剔除 ${before-after} 份「${entry.dim?DIMS[entry.dim].L[entry.lv]:'不符合'}」`);
  if(acts.length){
    const left=S.pool.length+S.stack.length;
    S.flash = left===0
      ? `已生效：${acts.join('；')}<br><b style="color:var(--pass)">池子被筛空了 —— 左上角松一条，或在记忆里删掉刚才这条。</b>`
      : `已生效：${acts.join('；')}（池内剩 ${left} 份）`;
    setTimeout(()=>{ S.flash=null; learnUI(); }, left===0?10000:6000);
  }
  refit(); saveMemNow(); renderNotes(); learnUI(); if($('#memlist')) renderMem();
}

  for(let i=1;i<L.length;i++) f.push({dim,lv:L[i]});} return f})();

// 一句话想法 → 猜它在说哪个维度。这是「澄清需求」最轻量的形态。
const HINTS=[

  [/原型|作品|figma|竞品分析|方法论/i,'proof','work',1],
  [/量化|指标|转化|留存|增长了|提升了|拿得出.{0,3}结果|数据驱动|有数据/,'proof','quant',1],

/* 按岗位给几条起步的记忆。写不出来的时候，从否定别人开始最容易 */

/* 规则型偏好：不只是指向维度，而是真的改变筛选和权重 */
function reflowPool(){
  const decided=new Set(S.decisions.map(d=>d.card.name));
  const inHand=new Set(S.stack.map(x=>x.card.name));
  S.pool=S.deck.filter(c=>passes(c,S.F)&&!decided.has(c.name)&&!inHand.has(c.name));
  for(let i=S.stack.length-1;i>=0;i--) if(!passes(S.stack[i].card,S.F)){ S.stack[i].el.remove(); S.stack.splice(i,1); }
  S.Fdraft=JSON.parse(JSON.stringify(S.F));
  fill(); layout(true);
}
/* 数值型软偏好：不进 one-hot 模型，作为排序加成，越高越靠前 */
const SOFTN=[
  [/GPA|绩点/i,               'gpa',    'GPA 越高越靠前',      c=>{const g=parseFloat(c.gpa);return g>0?Math.max(0,Math.min(1,(g-3)/1)):0.5}],
  [/排名|名次|rank/i,          'rank',   '专业排名越靠前越靠前', c=>{const r=parseFloat(c.rank);return r>0?Math.max(0,Math.min(1,1-r/50)):0.5}],
  [/实习(时间|时长)|经验(多|长)/,'months', '实习越久越靠前',      c=>Math.max(0,Math.min(1,(c.months||0)/12))],
];
function softBonus(c){
  let b=0;
  for(const n of (S.notes||[])){
    if(!n.soft||n.sign<0) continue;
    const sp=SOFTN.find(x=>x[1]===n.soft);
    if(sp) b += 0.12*(n.boost||1)*sp[3](c);
  }
  return b;
}
const PRIO=[[/垂直|同赛道|赛道|业务理解/,'track','same'],[/0\s*[-到→]\s*1|从零|从 ?0|冷启动|自己搭/,'z01','yes'],
            [/产出|结果|数据|量化|拿得出/,'proof','quant'],[/院校|学校|学历|名校/,'school','t1'],
            [/竞品|对家/,'co','rival'],[/大厂/,'co','big'],[/创业|小团队|抗压/,'co','start'],
            [/技术|代码|科班|工程/,'major','cs']];
function applyThought(t){
  const acts=[]; let note=null;
  // 1) 数值硬规则：「最长的实习不超过 3 个月的不要」
  let m=t.match(/(\d+)\s*个?(月|年)/);
  if(m && /实习|经历|经验|年限/.test(t) && /不接受|不要|不看|排除|至少|不少于|以上|起步/.test(t)){
    const n=+m[1];
    let lo=/不超过|少于|不足|小于/.test(t) ? n+1 : n;   // 「不超过3个月的不要」⇒ ≥4
    if(m[2]==='年'&&!SOC()) lo*=12;                     // 实习/校招池的单位是月
    S.F.months[0]=Math.max(S.F.months[0],lo);
    acts.push(`硬性条件：${SOC()?'工作年限':'实习总时长'} ≥ ${S.F.months[0]} ${SOC()?'年':'个月'}`);
  }
  // 2) 放宽：「实习经验好的话，院校条件可以放宽」
  if(/放宽|不卡|不限了|无所谓|不重要|不 ?care/i.test(t)){
    for(const [re,k,label] of [[/院校|学校|学历/, 'school','院校'],[/英语|语言/,'lang','语言'],
                               [/年龄/,'age','年龄'],[/技术栈|编程/,'code','技术栈']]){
      if(!re.test(t)) continue;
      if(k==='age') S.F.age=[18,63]; else S.F[k]=[];
      acts.push(`${label}从硬性条件改为不限`);
    }
    for(const [re,dim,lv] of [[/实习经验|实习经历|经历好|做过事/,'proof','quant'],[/垂直|同赛道/,'track','same']])
      if(re.test(t)){ note={dim,lv,sign:1,boost:2}; acts.push(`「${DIMS[dim].L[lv]}」加权补上`); break; }
  }
  // 3) 优先级：「实习经历垂直大于一切」
  m=t.match(/大于一切|最重要|压倒|第一位|优先级最高|是关键/);
  if(m){
    for(const [re,dim,lv] of PRIO)
      if(re.test(t)){ note={dim,lv,sign:1,boost:3}; acts.push(`「${DIMS[dim].L[lv]}」权重拉满`); break; }
  } else if(/优先|加分|更好|倾向/.test(t) && !/放宽/.test(t)){
    for(const [re,dim,lv] of PRIO)
      if(re.test(t)){ note={dim,lv,sign:1,boost:2}; acts.push(`「${DIMS[dim].L[lv]}」加权`); break; }
  }
  // 3.5) 数值软偏好：「我喜欢 GPA top 的候选人」「实习时间长的优先」
  if(/喜欢|偏爱|top|越.{0,4}越好|高的优先|长的优先|靠前的优先/i.test(t) && !/以上|不低于|≥/.test(t)){
    for(const [re,key,label] of SOFTN.map(x=>[x[0],x[1],x[2]]))
      if(re.test(t)){ note={soft:key, sign:1, boost:1}; acts.push(`排序偏好：${label}`); break; }
  }
  // 4) GPA：「GPA 3.5 以上」
  m=t.match(/GPA\s*([\d.]+)\s*(以上|起|＋|\+)?/i);
  if(m){ S.F.gpaMin=Math.max(S.F.gpaMin||0, parseFloat(m[1])); acts.push(`硬性条件：GPA ≥ ${S.F.gpaMin}`); }
  // 5) 年龄：「25 岁以下」
  m=t.match(/(\d{2})\s*岁\s*(以下|以内|以里)/);
  if(m){ S.F.age=[S.F.age[0], Math.min(S.F.age[1], +m[1])]; acts.push(`硬性条件：年龄 ≤ ${m[1]} 岁`); }
  // 6) 到岗：「每周至少到岗 4 天」
  m=t.match(/(\d)\s*天.{0,6}(到岗|实习)|到岗.{0,6}(\d)\s*天/);
  if(m && /至少|以上|起|必须|要求/.test(t) && !SOC()){
    const n=+(m[1]||m[3]);
    S.F.onsite=[3,4,5].filter(x=>x>=n);
    acts.push(`硬性条件：每周到岗 ≥ ${n} 天`);
  }
  // 7) 英语：「英语必须流利」
  if(/英语|口语/.test(t) && /必须|要好|流利|过关|工作语言|能开会/.test(t) && !/放宽/.test(t)){
    S.F.lang=['en_work']; acts.push('硬性条件：英语可作为工作语言');
  }
  // 8) 原文硬检索：「不要外包背景的」「简历里要有 Kaggle」
  m=t.match(/(?:不要|不看|排除|别.{0,3}给我)\s*([A-Za-z\u4e00-\u9fa5]{2,10}?)(?:背景|出身|经历)?的?$/);
  if(m && !/月|年|岁|天|GPA/i.test(m[1])){
    S.F.kws=S.F.kws||[]; S.F.kws.push({t:m[1],neg:true});
    acts.push(`排除词：「${m[1]}」`);
  }
  m=t.match(/(?:必须有|要有|简历里要有|得有)\s*([A-Za-z\u4e00-\u9fa5][A-Za-z\u4e00-\u9fa5 ]{1,14})/);
  if(m){
    S.F.kws=S.F.kws||[]; S.F.kws.push({t:m[1].trim(),neg:false});
    acts.push(`必含词：「${m[1].trim()}」`);
  }
  return {acts, note};
}
function tagNote(t){
  for(const [re,dim,lv,sign] of HINTS) if(re.test(t)) return {dim,lv,sign};
  return null;
}
function rowsOf(){
  const rows=[];
  // 你打字说出来的想法，和滑卡一样是证据，权重更高一点
  const NL=(S.notes||[]).length;
  for(const nt of (S.notes||[])){
    if(!nt.dim) continue;
    const posW=NL>1 ? 1+0.3*(1-(S.notes.indexOf(nt))/(NL-1)) : 1;   // 越靠前权重越高
    const k=FIDX[nt.dim+'|'+nt.lv];
    if(k!==undefined) rows.push({ix:[k], y:nt.sign>0?1:0, w:1.5*(nt.boost||1)*posW});
    else for(const lv in DIMS[nt.dim].L){          // 参照档没有特征位，就反过来压其他档
      const j=FIDX[nt.dim+'|'+lv];
      if(j!==undefined) rows.push({ix:[j], y:nt.sign>0?0:1, w:1.0});
    }
  }
  for(const d of S.decisions){
    const ix=[];
    for(const dim in DIMS){ const k=FIDX[dim+'|'+d.card.d[dim]]; if(k!==undefined) ix.push(k); }
    // 犹豫时长是免费信号：秒滑的判断降权，盯了很久的加权
    const dwF = d.dw==null?1 : d.dw>=12?1.25 : d.dw>=5?1.1 : d.dw<1.2?0.85 : 1;
    rows.push({ix, y:d.v==='no'?0:1, w:(d.v==='star'?1.6:1)*dwF});
    // 定点批注 → 一条只作用在那个维度上的合成观测，权重更高
    for(const k in (d.anno||{})){
      const an=d.anno[k]; if(!an.sign) continue;
      const j=FIDX[an.dim+'|'+d.card.d[an.dim]];
      rows.push({ix:j===undefined?[]:[j], y:an.sign>0?1:0, w:1.3});
    }
  }
  return rows;
}
/* L2 正则的 logistic 回归，梯度下降。n 只有二三十，正则必须给足 */
function fitRidge(rows,ys,lam,iters){
  const P=FEATS.length, b=new Float64Array(P), n=Math.max(1,rows.length), lr=.55;
  let b0=0;
  for(let t=0;t<iters;t++){
    const g=new Float64Array(P); let g0=0;
    for(let i=0;i<rows.length;i++){
      const r=rows[i]; let z=b0;
      for(const j of r.ix) z+=b[j];
      const e=(1/(1+Math.exp(-z))-ys[i])*r.w;
      g0+=e; for(const j of r.ix) g[j]+=e;
    }
    b0-=lr*g0/n;
    for(let j=0;j<P;j++) b[j]-=lr*(g[j]/n+lam*b[j]);
  }
  return {b,b0};
}
function spreadsOf(b){
  const o={};
  for(const dim in DIMS){
    const v=Object.keys(DIMS[dim].L).map(lv=>{const k=FIDX[dim+'|'+lv]; return k===undefined?0:b[k];});
    o[dim]={spread:Math.max(...v)-Math.min(...v), beta:v};
  }
  return o;
}
/* 边际统计：只用来给人看「右滑 9 人里 8 人是…」这种可核对的证据 */
function marginals(dim){
  const levels={};
  for(const lv in DIMS[dim].L){
    let wp=0,wn=0,np=0,nn=0;
    for(const d of S.decisions){
      if(d.card.d[dim]!==lv) continue;
      const w=Math.abs(V[d.v]);
      if(d.v==='no'){wn+=w;nn++} else {wp+=w;np++}
    }
    const exp=np+nn, rate=(wp+1.5)/(wp+wn+3);
    levels[lv]={lv,label:DIMS[dim].L[lv],np,nn,exp,rate,adj:0.5+(rate-0.5)*exp/(exp+5)};
  }
  const seen=Object.values(levels).filter(l=>l.exp>=3).map(l=>l.adj);
  return {levels, mspread: seen.length>1?Math.max(...seen)-Math.min(...seen):0};
}

/* perm=true 时跑置换检验：把你的判断随机打乱后重新拟合 N 次，
   看「控制住其他维度之后」的效应有多容易碰巧出现 —— 把真偏好和小样本噪音分开 */
function analyze(perm,it){
  const D=S.decisions, rows=rowsOf(), ys=rows.map(r=>r.y);
  const LAM=.015, IT=it||400;   // 观测与置换必须用同样的迭代数，否则零分布系统性偏低
  const FT=fitRidge(rows,ys,LAM,IT), S0=spreadsOf(FT.b), out={};
  for(const dim in DIMS){
    const m=marginals(dim);
    out[dim]={dim,label:DIMS[dim].label,levels:m.levels,
              spread:m.mspread,        // 边际落差（给人看的证据）
              power:S0[dim].spread,    // 偏效应（用来排序和判显著）
              beta:S0[dim].beta, p:null, praw:null, z:null, sensitive:!!DIMS[dim].sensitive};
  }
  if(perm && D.length>=8){
    // maxT 置换检验：拿「每轮所有维度里最大的效应」当零分布，
    // 一次性控制住 6 个维度的多重比较，否则总有一个维度看着像有信号
    const R=140, hits={}, raw={}, sum={}, sq={};
    for(const dim in DIMS){ hits[dim]=0; raw[dim]=0; sum[dim]=0; sq[dim]=0; }
    const arr=[...ys]; let sd=987654321;
    const rnd=()=>{sd^=sd<<13;sd>>>=0;sd^=sd>>>17;sd^=sd<<5;sd>>>=0;return sd/4294967296};
    for(let r=0;r<R;r++){
      for(let i=arr.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}
      const sp=spreadsOf(fitRidge(rows,arr,LAM,IT).b);
      let mx=0; for(const dim in DIMS) mx=Math.max(mx,sp[dim].spread);
      for(const dim in DIMS){
        const v=sp[dim].spread;
        if(v>=S0[dim].spread) raw[dim]++;
        if(mx>=S0[dim].spread) hits[dim]++;
        sum[dim]+=v; sq[dim]+=v*v;
      }
    }
    for(const dim in DIMS){
      out[dim].p=hits[dim]/R; out[dim].praw=raw[dim]/R;
      // 用这个维度自己的零分布标准化：4 个取值的维度每格样本更少、效应天然更小，
      // 不标准化的话统一阈值会系统性漏掉它们
      const mu=sum[dim]/R, sd=Math.sqrt(Math.max(1e-9, sq[dim]/R-mu*mu));
      out[dim].z=(S0[dim].spread-mu)/sd;
    }
  }
  return {out, fit:FT, pos:D.filter(d=>d.v!=='no').length, neg:D.filter(d=>d.v==='no').length, n:D.length};
}

}

  const who = S.year==='社招' ? role : `${S.role}${S.year==='实习'?'实习生':'校招生'}`;
  const hardBits=[];
  if(S.F.school.length) hardBits.push(S.F.school.map(v=>FDEF.school.opts.find(o=>o[0]===v)[1]).join('/'));
  if(S.F.code.length) hardBits.push('会 '+S.F.code.join('、'));
  if(S.F.lang.length) hardBits.push(S.F.lang.map(v=>FDEF.lang.opts.find(o=>o[0]===v)[1]).join('、'));
  const quote=(notes||[]).find(n=>n.sign>0&&(n.note||'').length>=6);
  let t=`<b style="font-family:var(--display);font-size:17px">「一个${sl.join('、')}的${who}。」</b><br><br>`;
  t+=`必须是${sl.join('、')}的人`;
  t+= pl.length?`；同时${pl.join('、')}的直接进面。`:'。';
  if(ol.length) t+=`${ol.join('、')}的不看。`;
  if(hardBits.length) t+=`门槛：${hardBits.join('，')}。`;
  if(quote) t+=`<br><br>用你自己的话说 ——「${quote.note}」（评 ${quote.name} 时说的）。`;
  t+=`<br><br>这个人要解决的问题：<span style="color:var(--ink3)">（这句只有你能写）</span>`;
  return t;
}

/* ---- 在线预测：模型先猜你下一张怎么滑，猜中率就是「有没有变好」 ---- */
let FIT=null;
function refit(){
  const rows=rowsOf();
  FIT = rows.length>=4 ? fitRidge(rows,rows.map(r=>r.y),.015,400) : null;
}
function predictP(card){
  if(!FIT) return null;
  let z=FIT.b0;
  for(const dim in DIMS){ const k=FIDX[dim+'|'+card.d[dim]]; if(k!==undefined) z+=FIT.b[k]; }
  return Math.min(.99, 1/(1+Math.exp(-z)) + softBonus(card));
}
function hitRate(win){
  const d=S.decisions.filter(x=>x.pred!=null&&!x.ch&&!x.duel).slice(-win);
  if(!d.length) return null;
  const hit=d.filter(x=>(x.pred>=.5)===(x.v!=='no')).length;
  return {hit, n:d.length, r:hit/d.length};
}

function cardText(c){
  if(c._st) return c._st;
  c._st = (c.raw || [c.school,c.major,c.exp1.co,c.exp1.role,...(c.exp1.lines||[]),
    ...(c.exp2?[c.exp2.co,c.exp2.role,...(c.exp2.lines||[])]:[]),
    c.proj?c.proj.title+' '+c.proj.line:'', (c.skill||[]).join(' '), (c.code||[]).join(' '), c.self||''
  ].join(' ')).toLowerCase();
  return c._st;
}
function memExcluded(c){
  for(const x of (S.notes||[]))
    if(x.sign<0&&x.dim&&x.lv&&c.d[x.dim]===x.lv) return x;
  return null;
}
function passes(c,F){
  if(memExcluded(c)) return false;
  for(const k of (F.kws||[])){
    const hit=cardText(c).includes(k.t.toLowerCase());
    if(k.neg? hit : !hit) return false;
  }
  if(F.gpaMin>0){ const g=parseFloat(c.gpa); if(g>0&&g<F.gpaMin) return false; }
  if(c.age<F.age[0]||c.age>F.age[1]) return false;
  if(c.months<F.months[0]||c.months>F.months[1]) return false;
  if(F.school.length && !F.school.includes(c.d.school)) return false;
  if(F.onsite.length && !F.onsite.includes(c.onsite)) return false;
  if(F.code.length && !F.code.every(x=>c.code.includes(x))) return false;   // 「且」
  if(F.lang.length && !F.lang.some(x=>                                       // 「或」
      x==='en_work' ? c.en==='工作' : x==='en_daily' ? (c.en==='工作'||c.en==='日常') : x==='fr' ? !!c.fr : !!c.jp)) return false;
  return true;
}
const activeCount=F=>{
  let n=0;
  if(F.age[0]>18||F.age[1]<63) n++;
  if(F.months[0]>0||F.months[1]<14) n++;
  for(const k of ['school','lang','code','onsite']) if(F[k].length) n++;
  if(F.kws&&F.kws.length) n++;
  if(F.gpaMin>0) n++;
  return n;
};

function paintRange(r){
  const [lo,hi]=[...r.querySelectorAll('input')];
  const min=+lo.min, max=+lo.max, f=r.querySelector('.fillbar');
  const a=Math.min(+lo.value,+hi.value), b=Math.max(+lo.value,+hi.value);
  const pct=v=>(v-min)/(max-min);
  f.style.left = `calc(9px + ${pct(a)} * (100% - 18px))`;
  f.style.width= `calc(${pct(b)-pct(a)} * (100% - 18px))`;
}
function passRate(F){
